a":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:dibk-tek17-11-3","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:dibk-tek17-11-3","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:dibk-tek17-11-11","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:dibk-tek17-11-11","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:dibk-tek17-11-12","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:dibk-tek17-11-12","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:helsedir-helse-miljo-4","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:helsedir-helse-miljo-4","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:helsedir-helse-miljo-14","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:helsedir-helse-miljo-14","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:helsedir-helse-miljo-18","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:helsedir-helse-miljo-18","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:udir-sikkerhet-beredskap","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:udir-sikkerhet-beredskap","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:udir-internkontroll","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:udir-internkontroll","label":"cites"}},{"data":{"id":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo__source:arbeidstilsynet-internkontroll","source":"research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo","target":"source:arbeidstilsynet-internkontroll","label":"cites"}}],"bodies":{"references/lovdata-brann-eksplosjonsvernloven":"# Brann- og eksplosjonsvernloven (LOV-2002-06-14-20) — §§ 1, 5–8 og 13\n\n- **Datokode**: `LOV-2002-06-14-20`[^lovdata-lov-2002-06-14-20]\n- **I kraft fra**: 2002-07-01 unntatt Svalbard, 2003-01-01\n- **Siste endring i kraft**: 2026-01-01\n\n## Authoritative Content\n\n### § 1. Formål\n\nLoven har som formål å verne liv, helse, miljø og materielle verdier mot brann og eksplosjon, mot ulykker med farlig stoff og farlig gods og andre akutte ulykker, samt uønskede tilsiktede hendelser.\n\n### § 5. Den enkeltes plikt til å forebygge og begrense skadevirkningene ved brann, eksplosjon og annen ulykke\n\nEnhver plikter å vise alminnelig aktsomhet og opptre på en slik måte at brann, eksplosjon og annen ulykke forebygges.\nEnhver plikter ved brann, eksplosjon eller annen ulykke straks å underrette de som er utsatt for fare og ved behov varsle nødalarmeringssentral. Det samme gjelder ved overhengende fare for en slik hendelse.\nEnhver som oppholder seg nær en brann, eksplosjon eller annen ulykke plikter etter evne å gjøre det som er mulig for å begrense skadevirkningene.\nEnhver plikter å delta i brannvesenets rednings- og slokkearbeid når innsatsleder krever det, samt stille eiendom, bygninger, materiell og eventuelt personell til disposisjon for slik innsats. Det kan gjøres inngrep i den enkeltes materielle verdier dersom dette er nødvendig for å gjennomføre redningsinnsats eller begrense skade. Inngrep i privates eiendom kan likevel bare foretas dersom dette er nødvendig for å sikre liv eller verne verdier som er større enn det som går tapt eller står i fare for å gå tapt ved inngrepet.\nDepartementet kan gi forskrifter om den enkeltes plikt til å forebygge og begrense skadevirkningene ved brann, eksplosjon og andre ulykker.\n\n### § 6. Forebyggende sikringstiltak og vedlikehold\n\nEier av byggverk, område, transportmiddel, produksjonsutstyr, annen innretning eller produkt plikter å sørge for nødvendige sikringstiltak for å forebygge og begrense brann, eksplosjon eller annen ulykke.\nEier og bruker av byggverk, område, transportmiddel, produksjonsutstyr, annen innretning eller produkt plikter å holde bygningstekniske konstruksjoner, sikkerhetsinnretninger og øvrige sikringstiltak til vern mot brann, eksplosjon eller annen ulykke i forsvarlig stand og påse at disse til enhver tid virker etter sin hensikt.\nEier eller bruker skal etter en eventuell brann, eksplosjon eller annen ulykke sørge for vakthold og andre nødvendige sikringstiltak når leder av brannvesenet krever dette.\nDepartementet kan gi forskrifter om eiers og brukers plikter til rapportering, sikringstiltak, vedlikehold og vakthold etter denne bestemmelsen.\n\n### § 7. Tiltak ved store arrangementer\n\nDen ansvarlige for store arrangementer, utstillinger, forestillinger, møter og andre tilstelninger skal i god tid før arrangementet sende melding til lokal tilsynsmyndighet, dersom arrangementet skal avholdes i et byggverk eller på et område som normalt ikke benyttes til denne type arrangementer.\nVed melding om arrangementer kan kommunen kreve de opplysninger som er nødvendige for å vurdere faren for brann, og fastsette de nødvendige brannsikringstiltak og begrensninger, herunder krav til ansvarshavende arrangør.\nKommunestyret selv kan gi lokale forskrifter med nærmere bestemmelser om meldeplikten.\n\n### § 8. Systematisk helse-, miljø- og sikkerhetsarbeid\n\nVirksomheter plikter å gjennomføre et systematisk helse-, miljø- og sikkerhetsarbeid (internkontroll) for å sikre at krav fastsatt i eller i medhold av denne loven overholdes. Tilsynsmyndigheten kan bestemme at også andre skal gjennomføre systematisk helse-, miljø- og sikkerhetsarbeid. Det skal kunne dokumenteres overfor tilsynsmyndighetene at loven, forskrifter og enkeltvedtak blir etterlevet.\nDepartementet kan gi forskrifter om systematisk helse-, miljø- og sikkerhetsarbeid.\n\n### § 13. Særskilte brannobjekter\n\nKommunen skal identifisere og føre fortegnelse over byggverk, opplag, områder, tunneler, virksomheter m.m. hvor brann kan medføre tap av mange liv eller store skader på helse, miljø eller materielle verdier.\nKommunen skal sørge for at det føres tilsyn i byggverk m.m. som nevnt i første ledd for å påse at disse er tilstrekkelig sikret mot brann. Tilsynet skal omfatte alle forhold av betydning for brannsikkerheten, herunder bygningsmessige, tekniske, utstyrsmessige og organisatoriske brannsikringstiltak og forhold av betydning for gjennomføring av brannbekjempelse og øvrig redningsinnsats.\nKommunen skal overfor sentral tilsynsmyndighet kunne dokumentere hvordan tilsyn med byggverk m.m. som nevnt i første ledd, som kommunen eier eller bruker, er gjennomført, og hvordan eventuelle pålegg er fulgt opp.\nKommunen kan ved enkeltvedtak bestemme at det skal føres tilsyn med andre byggverk m.m. enn de som er omfattet av første ledd. Kommunestyret selv kan fastsette lokal forskrift om tilsyn med andre byggverk m.m. enn de som er omfattet av første ledd.\nDepartementet kan gi forskrifter om tilsyn med særskilte brannobjekter.\n\n## Čatnojuvvon čoahkkedoahpagat\n\n- [Buollinvárjalus mánáidgárddiin Norggas — láhkavuođđu, ovddasvástádusjuohku, teknihkalaš gáibádusat ja báhtaranrutiinnat](/research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo.md)\n\n[^lovdata-lov-2002-06-14-20]: Brann- og eksplosjonsvernloven (LOV-2002-06-14-20) — §§ 1, 5–8 og 13\n","references/lovdata-brannforebygging":"# Forskrift om brannforebygging (FOR-2015-12-17-1710) — Kapittel 1–3\n\n- **Datokode**: `FOR-2015-12-17-1710`[^lovdata-for-2015-12-17-1710]\n- **I kraft fra**: 2016-01-01\n- **Siste endring i kraft**: 2020-06-11\n\n## Authoritative Content\n\n### § 1. Formål\n\nForskriften skal bidra til å redusere sannsynligheten for brann, og begrense konsekvensene brann kan få for liv, helse, miljø og materielle verdier.\n\n### § 2. Virkeområde\n\nForskriften gjelder plikter for:\n- enhver til å vise aktsomhet ved brannfarlig aktivitet\n\n- eiere og brukere av byggverk til å forebygge brann\n\n- kommunene til å forebygge brann\n\n- de som omsetter bærbart brannslokkeutstyr.\n\n### § 3. Generelle krav til aktsomhet\n\nEnhver plikter å vise aktsomhet ved gjennomføring av aktivitet som kan føre til brann.\nDet er forbudt å gjøre opp ild eller behandle brannfarlige gjenstander utendørs under slike forhold eller på en slik måte at det kan føre til brann. Oppgjort ild må ikke forlates før den er fullstendig slokket.\nDet er i tidsrommet 15. april til 15. september forbudt å gjøre opp ild eller behandle brannfarlige gjenstander i eller i nærheten av skog og annen utmark. Det er likevel tillatt å gjøre opp ild når\n- kommunen har gitt tillatelse eller\n\n- kommunestyret selv gjennom lokal forskrift har tillatt dette fordi lokale forhold tilsier det eller\n\n- det er åpenbart at brann ikke kan oppstå.\n\nNår brannfaren er spesielt stor eller det foreligger andre ekstraordinære forhold, kan kommunen innføre forbud mot å gjøre opp ild eller behandle brannfarlige gjenstander når som helst i løpet av året og alle steder utendørs i kommunen. Forbudet skal klart avgrenses\n- geografisk til hele kommunen eller områder i kommunen og\n\n- tidsmessig for en periode på maksimalt 60 dager.\n\nForbudet skal oppheves så snart brannfaren eller de ekstraordinære forholdene er over. Forbudet kan vedtas som forskrift uten forhåndsvarsling og kunngjøring etter forvaltningsloven § 37 andre ledd og § 38 første ledd bokstav c). Kommunen skal sørge for å gjøre forbudet alminnelig kjent på stedet det gjelder.\n\n### § 4. Kunnskap og informasjon om brannsikkerhet i byggverk\n\nEieren av et byggverk skal kjenne kravene til brannsikkerhet som gjelder for byggverket.\nEieren skal ha kunnskap om bygningsdeler, installasjoner og utstyr i byggverket som skal oppdage brann eller begrense konsekvensene av brann.\nEieren skal gjøre den som har rett til å bruke byggverket kjent med kravene som gjelder for bruken av byggverket, og med alle egenskapene ved byggverket som har betydning for brannsikkerheten. Er det flere som har rett til å bruke byggverket, skal eieren sikre at all bruk samordnes på en måte som bidrar til å forebygge brann.\n\n### § 5. Kontroll og vedlikehold av bygningsdeler og sikkerhetsinnretninger\n\nEieren av et byggverk skal sørge for at bygningsdeler, installasjoner og utstyr i byggverket som skal oppdage brann eller begrense konsekvensene av brann, blir kontrollert og vedlikeholdt slik at de fungerer som forutsatt. Kontrollen skal avklare om sikkerhetsinnretningene:\n- oppfyller kravene til brannsikkerhet som gjelder for byggverket\n\n- fungerer hver for seg og sammen med hverandre.\n\nKontrollens omfang og hyppighet skal være tilpasset sikkerhetsinnretningene og byggverkets størrelse, kompleksitet, bruk og risiko.\n\n### § 6. Kontroll og vedlikehold av fyringsanlegg\n\nEieren av et byggverk skal melde fra til kommunen når det er installert nytt ildsted eller gjort andre vesentlige endringer av fyringsanlegget.\nEieren skal sørge for at fyringsanlegget virker som forutsatt. Dersom det blir oppdaget feil på anlegget som vesentlig øker risikoen for brann, skal anlegget stenges for bruk dersom feilen ikke utbedres umiddelbart.\nEtter å ha mottatt et varsel om feiing eller tilsyn, skal eieren sørge for at feieren har tilfredsstillende atkomst til hele fyringsanlegget.\n\n### § 7. Brannvarsling og manuelt slokkeutstyr i bolig og fritidsbolig\n\nEieren av boliger og fritidsboliger skal sørge for at byggverkene har brannalarmanlegg eller et tilstrekkelig antall røykvarslere. Det skal være minst én detektor eller røykvarsler i hver etasje, som skal dekke kjøkken, stue, sone utenfor soverom og sone utenfor tekniske rom. Alarmen skal kunne høres tydelig på oppholdsrom og soverom når dørene mellom rommene er lukket.\nEieren skal sørge for at boliger og fritidsboliger er utstyrt med minst ett av følgende slokkeutstyr som kan brukes i alle rom:\n- formfast brannslange med innvendig diameter på minst 10 mm fast tilkoblet vannforsyningsnett\n\n- pulverapparat på minst 6 kg med ABC-pulver\n\n- skum- eller vannapparat på minst 9 liter\n\n- skum- eller vannapparat på minst 6 liter med effektivitetsklasse på minst 21A\n\n- annet manuelt slokkeutstyr med tilsvarende slokkekapasitet.\n\nEieren skal sørge for at røykvarslere og manuelt slokkeutstyr i boliger og fritidsboliger blir kontrollert ved funksjonsprøve eller ettersyn i samsvar med leverandørens anvisninger, og at de vedlikeholdes slik at de fungerer som forutsatt.\n\n### § 8. Oppgradering av byggverk\n\nEieren av et byggverk skal sørge for å oppgradere sikkerhetsnivået i byggverket slik at det minst tilsvarer nivået som fremkommer av de samlede kravene gitt i byggeforskrift 15. november 1984 nr. 1892 eller senere byggeregler. Oppgraderingen kan skje ved bygningstekniske tiltak, andre risikoreduserende tiltak eller ved en kombinasjon av slike. Oppgraderingsplikten gjelder så langt den kan gjennomføres innenfor en praktisk og økonomisk forsvarlig ramme.\n\n### § 9. Eierens systematiske sikkerhetsarbeid\n\nEn virksomhet som eier et byggverk skal fastsette mål og iverksette planer og tiltak for å sikre byggverket mot brann. Virksomheten skal iverksette:\n- rutiner som sikrer at kravene til brannsikkerhet som gjelder for byggverket blir overholdt\n\n- rutiner for å avdekke, rette opp og forebygge mangler ved bygningsdeler, installasjoner og utstyr som skal oppdage brann eller begrense konsekvensene av brann\n\n- rutiner for å avdekke, rette opp og forebygge mangler ved det systematiske sikkerhetsarbeidet.\n\nDet systematiske sikkerhetsarbeidet skal være tilpasset byggverkets størrelse, kompleksitet, bruk og risiko.\n\n### § 10. Eierens dokumentasjon\n\nEn virksomhet som eier et byggverk skal dokumentere at virksomhetens plikter etter § 4 til § 9 er oppfylt.\n\n### § 11. Brannsikker bruk av byggverk\n\nDen som har rett til å bruke et byggverk skal:\n- sørge for at byggverket brukes i samsvar med kravene til brannsikkerhet som gjelder for byggverket\n\n- unngå unødig risiko for brann, og sørge for at rømningsveiene opprettholder sin funksjon, herunder at fremkommeligheten ikke reduseres\n\n- informere eieren om endringer, forfall og skader i byggverket eller sikkerhetsinnretningene som kan påvirke sikkerheten mot brann\n\n- ved forhold som vesentlig reduserer brannsikkerheten, straks gjennomføre ekstraordinære tiltak inntil risikoen er normalisert.\n\n### § 12. Brukerens systematiske sikkerhetsarbeid\n\nEn virksomhet som har rett til å bruke et byggverk skal fastsette mål og iverksette planer og tiltak for å redusere risikoen for brann i byggverket. Virksomheten skal iverksette:\n- rutiner som sikrer at byggverket brukes i samsvar med kravene til brannsikkerhet som gjelder for byggverket\n\n- rutiner for evakuering og redning ved brann i byggverket\n\n- rutiner som sikrer at personer med arbeidsplass i byggverket har tilstrekkelige kunnskaper og ferdigheter i å forebygge og bekjempe brann\n\n- rutiner som sikrer at alle som oppholder seg i byggverket får tilstrekkelig informasjon om hvordan de skal unngå brann og opptre ved brann\n\n- rutiner for å avdekke, rette opp og forebygge mangler ved det systematiske sikkerhetsarbeidet.\n\nDet systematiske sikkerhetsarbeidet skal være tilpasset risikoen for brann som følge av virksomhetens bruk av byggverket.\n\n### § 13. Brukerens dokumentasjon\n\nEn virksomhet som har rett til å bruke et byggverk skal dokumentere at virksomhetens plikter etter § 11 og § 12 er oppfylt.\n\n## Čatnojuvvon čoahkkedoahpagat\n\n- [Buollinvárjalus mánáidgárddiin Norggas — láhkavuođđu, ovddasvástádusjuohku, teknihkalaš gáibádusat ja báhtaranrutiinnat](/research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo.md)\n\n[^lovdata-for-2015-12-17-1710]: Forskrift om brannforebygging (FOR-2015-12-17-1710) — Kapittel 1–3\n","references/lovdata-internkontroll":"# Internkontrollforskriften (FOR-1996-12-06-1127) — §§ 1–5\n\n- **Datokode**: `FOR-1996-12-06-1127`[^lovdata-for-1996-12-06-1127]\n- **I kraft fra**: 1997-01-01\n- **Siste endring i kraft**: 2026-01-01\n\n## Authoritative Content\n\n### §1\n\n§ 1. Formål\nGjennom krav om systematisk gjennomføring av tiltak, skal denne forskrift fremme et forbedringsarbeid i virksomhetene innen:\n- arbeidsmiljø\n\n- sikkerhet\n\n- forebygging av helseskade eller miljøforstyrrelser fra produkter eller forbrukertjenester\n\n- vern av det ytre miljø mot forurensning og en bedre behandling av avfall\n\n- forebygging av uhell og ulykker forbundet med egen lovlig aktivitet\n\n- forebygging av uønskede tilsiktede hendelser\n\nslik at målene i helse-, miljø- og sikkerhetslovgivningen oppnås.\n\n### §2\n\n§ 2. Virkeområde\nForskriften gjelder for virksomhet som omfattes av\n- lov om tilsyn med elektriske anlegg og elektrisk utstyr (lov 24. mai 1929 nr. 4)\n\n- sivilbeskyttelsesloven § 23 (egenbeskyttelsestiltak ved virksomheter) (lov 25. juni 2010 nr. 45)\n\n- produktkontrolloven (lov 11. juni 1976 nr. 79)\n\n- arbeidsmiljøloven (lov 17. juni 2005 nr. 62)\n\n- forurensningsloven, dersom virksomheten sysselsetter arbeidstaker (lov 13. mars 1981 nr. 6)\n\n- genteknologiloven (lov 2. april 1993 nr. 38)\n\n- strålevernloven (lov av 12. mai 2000 nr. 36).\n\n- brann- og eksplosjonsvernloven (lov 14. juni 2002 nr. 20).\n\nDenne forskrift kommer ikke til anvendelse på\n- Svalbard, med unntak av internkontroll etter forskrift 6. juni 2025 nr. 940 om sikkerhet i felt på Svalbard § 20\n\n- virksomhet som nevnt i arbeidsmiljøloven § 1-3\n\n- landanlegg i petroleumsvirksomheten som nevnt i forskrift 12. februar 2010 nr. 158 om helse, miljø og sikkerhet i petroleumsvirksomheten og på enkelte landanlegg (rammeforskriften) § 6, med unntak av aktiviteter som faller inn under sivilbeskyttelsesloven § 23.\n\n### §3\n\n§ 3. Definisjoner\nI denne forskrift betyr:\nInternkontroll: Systematiske tiltak som skal sikre at virksomhetenes aktiviteter planlegges, organiseres, utføres, sikres og vedlikeholdes i samsvar med krav fastsatt i eller i medhold av helse-, miljø- og sikkerhetslovgivningen.\nHelse-, miljø- og sikkerhetslovgivningen: De lover som er nevnt i § 2 første ledd samt forskrifter fastsatt i medhold av disse.\n\n### §4\n\n§ 4. Plikt til internkontroll\nDen som er ansvarlig for virksomheten skal sørge for at det innføres og utøves internkontroll i virksomheten og at dette gjøres i samarbeid med arbeidstakerne og deres representanter.\nArbeidstakerne skal medvirke ved innføring og utøvelse av internkontroll.\n\n### §5\n\n§ 5. Innholdet i det systematiske helse-, miljø- og sikkerhetsarbeidet. Krav til dokumentasjon\nInternkontrollen skal tilpasses virksomhetens art, aktiviteter, risikoforhold og størrelse i det omfang som er nødvendig for å etterleve krav i eller i medhold av helse-, miljø- og sikkerhetslovgivningen.\n\n| Internkontroll innebærer at virksomheten skal: | Dokumentasjon |\n| --- | --- |\n| 1. sørge for at de lover og forskrifter i helse-, miljø- og sikkerhetslovgivningen som gjelder for virksomheten er tilgjengelig, og ha oversikt over de krav som er av særlig viktighet for virksomheten | – |\n| 2. sørge for at arbeidstakerne har tilstrekkelig kunnskaper og ferdigheter i det systematiske helse-, miljø- og sikkerhetsarbeidet, herunder informasjon om endringer | – |\n| 3. sørge for at arbeidstakerne medvirker slik at samlet kunnskap og erfaring utnyttes | – |\n| 4. fastsette mål for helse, miljø og sikkerhet | må dokumenteres skriftlig |\n| 5. ha oversikt over virksomhetens organisasjon, herunder hvordan ansvar, oppgaver og myndighet for arbeidet med helse, miljø og sikkerhet er fordelt | må dokumenteres skriftlig |\n| 6. kartlegge farer og problemer og på denne bakgrunn vurdere risiko, samt utarbeide tilhørende planer og tiltak for å redusere risikoforholdene | må dokumenteres skriftlig |\n| 7. iverksette rutiner for å avdekke, rette opp og forebygge overtredelser av krav fastsatt i eller i medhold av helse-, miljø- og sikkerhets- lovgivningen | må dokumenteres skriftlig |\n| 8. foreta systematisk overvåkning og gjennomgang av internkontrollen for å sikre at den fungerer som forutsatt | må dokumenteres skriftlig |\n\nInternkontrollen skal dokumenteres i den form og det omfang som er nødvendig på bakgrunn av virksomhetens art, aktiviteter, risikoforhold og størrelse. Dokumentasjon som følger av krav i eller i medhold av helse-, miljø- og sikkerhetslovgivningen, for eksempel instrukser, tillatelser, kompetansebevis, sertifikater o.l. skal inngå.\nSkriftlig dokumentasjon etter denne forskrift skal minst omfatte annet ledd nr. 4) til og med nr. 8) i denne paragraf.\nFrivillige sertifikater kan også inngå som en del av dokumentasjonen.\n\n## Čatnojuvvon čoahkkedoahpagat\n\n- [Buollinvárjalus mánáidgárddiin Norggas — láhkavuođđu, ovddasvástádusjuohku, teknihkalaš gáibádusat ja báhtaranrutiinnat](/research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo.md)\n\n[^lovdata-for-1996-12-06-1127]: Internkontrollforskriften (FOR-1996-12-06-1127) — §§ 1–5\n","references/lovdata-tek17-kap11":"# Byggteknisk forskrift (TEK17, FOR-2017-06-19-840) — Kapittel 11 utvalgte paragrafer\n\n- **Datokode**: `FOR-2017-06-19-840`[^lovdata-for-2017-06-19-840]\n- **I kraft fra**: 2017-07-01\n- **Siste endring i kraft**: 2026-10-01\n\n## Authoritative Content\n\n### §11-1\n\n§ 11-1. Sikkerhet ved brann\n(1) Byggverk skal prosjekteres og utføres slik at det oppnås tilfredsstillende sikkerhet ved brann for personer som oppholder seg i eller på byggverket, for materielle verdier og for miljø- og samfunnsmessige forhold.\n(2) Det skal være tilfredsstillende mulighet for å redde personer og husdyr og for effektiv slokkeinnsats.\n(3) Byggverk skal plasseres, prosjekteres og utføres slik at sannsynligheten for brannspredning til andre byggverk blir liten.\n(4) Byggverk der brann kan utgjøre stor fare for miljøet eller berøre andre vesentlige samfunnsinteresser, skal prosjekteres og utføres slik at sannsynligheten for skade på miljøet eller andre vesentlige samfunnsinteresser blir liten.\n\n### §11-2\n\n§ 11-2. Risikoklasser\nUt fra den trusselen en brann kan innebære for skade på liv og helse, skal byggverk eller ulike bruksområder i et byggverk plasseres i risikoklasser etter tabellen nedenfor. Risikoklassene skal legges til grunn for prosjekteringen og utførelsen for å sikre rømning og redning ved brann.\nTabell: Risikoklasser\n\n| Risikoklasser | Byggverk kun beregnet for sporadisk personopphold | Personer i byggverk kjenner rømningsforhold, herunder rømningsveier, og kan bringe seg selv i sikkerhet | Byggverk beregnet for overnatting | Forutsatt bruk av byggverk medfører liten brannfare |\n| --- | --- | --- | --- | --- |\n| 1 | ja | ja | nei | ja |\n| 2 | ja/nei | ja | nei | nei |\n| 3 | nei | ja | nei | ja |\n| 4 | nei | ja | ja | ja |\n| 5 | nei | nei | nei | ja |\n| 6 | nei | nei | ja | ja |\n\n### §11-3\n\n§ 11-3. Brannklasser\nUt fra den konsekvensen en brann kan innebære for skade på liv, helse, samfunnsmessige interesser og miljøet, skal byggverk eller ulike deler av et byggverk plasseres i brannklasser etter tabellen nedenfor. Brannklassene skal legges til grunn for prosjekteringen og utførelsen for å sikre byggverkets bæreevne mv. ved brann.\nTabell: Brannklasser\n\n| Brannklasse | Konsekvens |\n| --- | --- |\n| 1 | Liten |\n| 2 | Middels |\n| 3 | Stor |\n| 4 | Særlig stor |\n\n### §11-11\n\n§ 11-11. Generelle krav om rømning og redning\n(1) Byggverk skal prosjekteres og utføres for rask og sikker rømning og redning. Det skal tas hensyn til personer med funksjonsnedsettelse.\n(2) Den tiden som er tilgjengelig for rømning, skal være større enn den tiden som er nødvendig for rømning fra byggverket. Det skal legges inn en tilfredsstillende sikkerhetsmargin.\n(3) Brannceller skal utformes og innredes slik at varsling, rømning og redning kan skje på en rask og effektiv måte.\n(4) Fluktvei fra oppholdssted til utgang fra en branncelle skal være oversiktlig og tilrettelagt for rask og effektiv rømning.\n(5) I den tiden en branncelle eller rømningsvei skal benyttes til rømning av personer, skal det ikke kunne forekomme temperaturer, røykgasskonsentrasjoner eller andre forhold som hindrer rømning.\n(6) Skilt, symbol og tekst som viser rømningsveier og sikkerhetsutstyr skal kunne leses og oppfattes under rømning når det er brann- eller røykutvikling.\n\n### §11-12\n\n§ 11-12. Tiltak for å påvirke rømnings- og redningstider\n(1) I byggverk som er beregnet for virksomhet hvor rømning og redning kan ta lang tid, skal det brukes aktive tiltak som øker den tilgjengelige rømningstiden. Følgende skal minst være oppfylt:\n- Byggverk eller del av byggverk i risikoklasse 4 hvor det kreves heis, skal ha automatisk brannslokkeanlegg. Deler av et byggverk med og uten automatisk brannslokkeanlegg skal være ulike brannseksjoner.\n\n- Byggverk i risikoklasse 6 skal ha automatisk brannslokkeanlegg.\n\n- Der det er krav om automatisk brannslokkeanlegg, kan det likevel benyttes andre tiltak som gir tilsvarende sikkerhet ved å hindre, begrense eller kontrollere en brann lokalt der den oppstår.\n\n(2) Byggverk skal ha utstyr for tidlig oppdagelse av brann slik at den nødvendige rømningstiden reduseres. Følgende skal minst være oppfylt:\n- Byggverk beregnet for virksomhet i risikoklasse 2 til 6 skal ha brannalarmanlegg.\n\n- I byggverk beregnet for få personer og byggverk av mindre størrelse kan det brukes røykvarslere dersom rømningsforholdene er særlig enkle og oversiktlige. Røykvarslere skal være tilknyttet strømforsyningen og ha batteri som reserveløsning. I branncelle med behov for flere røykvarslere skal varslerne være seriekoblet. I byggverk uten strømforsyning kan det benyttes batteridrevne røykvarslere.\n\n(3) I byggverk hvor flukt- og rømningsveiene er lange og har retningsendringer eller skal benyttes av mange personer, skal flukt- og rømningsveiene ha god belysning og være merket slik at rømning kan skje på en rask og effektiv måte. Store byggverk, byggverk beregnet for et stort antall personer og byggverk beregnet for virksomhet i risikoklasse 5 og 6 skal ha ledesystem.\n(4) For byggverk i risikoklasse 5 og 6, øvrige byggverk for publikum og for arbeidsbygninger, skal det foreligge evakueringsplaner før byggverket tas i bruk.\n(5) Plasseringen av branntekniske installasjoner som har betydning for rømnings- og redningsinnsatsen skal være tydelig merket, med mindre installasjonene bare er beregnet for personer i én bruksenhet og personene må forventes å være godt kjent med plasseringen.\n\n### §11-13\n\n§ 11-13. Utgang fra branncelle\n(1) Fra en branncelle skal det minst være én utgang til sikkert sted, eller utganger til to uavhengige rømningsveier, eller én utgang til rømningsvei som har to alternative rømningsretninger som fører videre til uavhengige rømningsveier eller sikre steder.\n(2) Brannceller i byggverk i risikoklasse 4 med inntil 8 etasjer kan ha utgang til ett trapperom utført som rømningsvei. Dette forutsetter at hver boenhet har minst ett vindu eller balkong som er tilgjengelig for rednings- og slokkeinnsats, jf. § 11-17.\n(3) Brannceller som består av flere etasjer, eller har mellometasje, skal ha minst én utgang fra hver etasje. I byggverk i risikoklasse 1, 2, 3 og 4 kan utgangen fra disse planene, utenom inngangsplanet, være vindu som er tilrettelagt for sikker rømning. I branncelle i byggverk i risikoklasse 4 uten krav om heis, kan øverste plan ha utgang via nærmeste underliggende plan dersom det installeres automatisk brannslokkeanlegg i branncellen.\n(4) I lave byggverk beregnet for virksomhet i risikoklasse 1, 2, 3 og 4 kan utgangen fra branncelle enten føre til sikkert sted, eller til rømningsvei som bare har én rømningsretning, forutsatt at hver branncelle har vinduer som er utformet og tilrettelagt for sikker rømning.\n(5) Brannceller for et stort antall personer skal ha tilstrekkelig antall, og minst to utganger til rømningsvei.\n(6) Fra brannceller som bare er beregnet for sporadisk personopphold kan utgang gå gjennom annen branncelle.\n(7) Dør til rømningsvei skal prosjekteres og utføres slik at den sikrer rask rømning og slik at det ikke oppstår fare for oppstuving. Følgende skal minst være oppfylt:\n- Døren skal ha tilstrekkelig bredde og høyde, og skal være lett å åpne uten bruk av nøkkel.\n\n- Døren skal slå ut i rømningsretningen. Dør til rømningsvei kan likevel slå mot rømningsretningen dersom det ikke er fare for oppstuving ved rømning.\n\n### §11-14\n\n§ 11-14. Rømningsvei\n(1) Rømningsvei skal på en oversiktlig og lettfattelig måte føre til et sikkert sted. Den skal ha tilstrekkelig bredde og høyde og være utført som egen branncelle tilrettelagt for rask og effektiv rømning.\n(2) Der rømningsveien går over flere etasjer, skal trappen skilles fra den øvrige rømningsveien og andre brannceller, slik at trappens funksjon som sikker rømningsvei ivaretas i den fastlagte tilgjengelige rømningstiden.\n(3) Rømningsvei som har to rømningsretninger, skal deles opp i hensiktsmessige enheter slik at røyk og branngasser ikke blokkerer begge rømningsretningene.\n(4) Hovedatkomst til byggverk eller del av byggverk for større personantall, skal være tilrettelagt for sikker rømning.\n(5) Dør i rømningsvei skal prosjekteres og utføres slik at den sikrer rask rømning og slik at det ikke oppstår fare for oppstuving. Følgende skal minst være oppfylt:\n- Døren skal ha tilstrekkelig bredde og høyde, og skal være lett å åpne uten bruk av nøkkel.\n\n- Døren skal slå ut i rømningsretningen. Dør i rømningsvei kan likevel slå mot rømningsretningen dersom det ikke er fare for oppstuving ved rømning.\n\n(6) Overbygget gård eller gate kan benyttes som rømningsvei dersom den er tilrettelagt for sikker rømning. Det skal i tillegg finnes alternativ rømningsvei utenom det overbygde arealet. Mindre brannceller som ligger på gårdsplanet, kan benytte det overbygde arealet som rømningsvei fra begge utgangene, forutsatt at arealet er tilrettelagt for sikker rømning.\n(7) Heis og rulletrapp kan ikke være del av fluktvei eller rømningsvei. Slike innretninger skal stoppe på en sikker måte ved brannalarm. Rullende fortau som er særlig tilrettelagt for sikker bruk, kan være del av fluktvei eller rømningsvei.\n\n### §11-16\n\n§ 11-16. Tilrettelegging for manuell slokking\n(1) Byggverk skal være tilrettelagt for effektiv manuell slokking av brann.\n(2) I eller på alle byggverk der brann kan oppstå, skal det være manuelt brannslokkeutstyr for effektiv slokkeinnsats i startfasen av brannen. Dette kommer i tillegg til et eventuelt automatisk brannslokkeanlegg.\n(3) Brannslokkeutstyret skal være plassert slik at slokkeinnsatsen blir effektiv. For mindre byggverk med virksomhet i risikoklasse 1 kan utstyret være plassert i et nærliggende byggverk.\n(4) Plasseringen av brannslokkeutstyret skal være tydelig merket med mindre det bare er beregnet for personer i én bruksenhet og personene må forventes å være godt kjent med plasseringen.\n\n## Čatnojuvvon čoahkkedoahpagat\n\n- [Buollinvárjalus mánáidgárddiin Norggas — láhkavuođđu, ovddasvástádusjuohku, teknihkalaš gáibádusat ja báhtaranrutiinnat](/research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo.md)\n\n[^lovdata-for-2017-06-19-840]: Byggteknisk forskrift (TEK17, FOR-2017-06-19-840) — Kapittel 11 utvalgte paragrafer\n","research/buollinvarjalus-manaidgarddiin-norggas-lahkavuo":"# Buollinvárjalus mánáidgárddiin Norggas — láhkavuođđu, ovddasvástádusjuohku, teknihkalaš gáibádusat ja báhtaranrutiinnat\n\nBuollinvárjalus mánáidgárddiin (*brannvern i barnehager*) lea čadnojuvvon máŋgga našuvnnalaš láhkii ja láhkaásahussii, mat oktasaččat galget várjalit mánáid, bargiid, birrasa ja ávnnaslaš árvvuid buollima ja eará fáhkka lihkohisvuođaid vuostá[^lovdata-lov-2002-06-14-20] [^lovdata-for-2015-12-17-1710] [^helsedir-helse-miljo-14]. Dát regulerenbagadus čohkke Norgga gustovaš láhkavuođu, vistti eaiggáda (*eier*) ja geavaheaddji (*bruker*) gaskasaš ovddasvástádusjuogu, huksen- ja buollinteknihkalaš gáibádusaid, báhtaran- ja hárjehallanrutiinnaid sihke suohkanlaš bearráigeahču njuolggadusaid[^lovdata-for-2015-12-17-1710] [^lovdata-for-2017-06-19-840].\n\n---\n\n## 1. Láhkavuođđu ja láhkaásahusat (*Juridisk og regulatorisk rammeverk*)\n\nNorgga mánáidgárddiid buollinvárjalus vuođđuduvvá viđa váldoláhkii ja -láhkaásahussii, maid stáhta eiseválddit — **Servodatsihkarvuođa ja gearggusvuođa direktoráhtta** (*Direktoratet for samfunnssikkerhet og beredskap — DSB*), **Huksenkvalitehta direktoráhtta** (*Direktoratet for byggkvalitet — DiBK*), **Dearvvašvuođadirektoráhtta** (*Helsedirektoratet*), **Oahpahusdirektoráhtta** (*Utdanningsdirektoratet — Udir*) ja **Bargobearráigeahčču** (*Arbeidstilsynet*) — hálddašit ja bagadit[^dsb-veiledning-brannforebygging] [^dibk-tek17-11-2] [^helsedir-helse-miljo-14] [^udir-sikkerhet-beredskap] [^arbeidstilsynet-internkontroll].\n\n### 1.1 Buollin- ja bávkkáhanvárjalusláhka (*Brann- og eksplosjonsvernloven, LOV-2002-06-14-20*)\n\nLáhka [Brann- og eksplosjonsvernloven (LOV-2002-06-14-20)](/references/lovdata-brann-eksplosjonsvernloven.md) lea buot buollinvárjalusbarggu bajimus láhkavuođđu Norggas[^lovdata-lov-2002-06-14-20]:\n\n- **Ulbmil (`§ 1. Formål`)**: Lága ulbmil lea várjalit heakka, dearvvašvuođa, birrasa ja ávnnaslaš árvvuid buollima ja bávkkáhusa vuostá, váralaš ávdnasiiguin ja váralaš gálvvuiguin čuožžilan lihkohisvuođaid ja eará fáhkka lihkohisvuođaid vuostá, sihke sávakeahtes iešdáhtolaš dáhpáhusaid (*uønskede tilsiktede hendelser*) vuostá[^lovdata-lov-2002-06-14-20].\n- **Juohkehačča várrogasvuođa- ja dieđihangeatnegasvuohta (`§ 5. Den enkeltes plikt til å forebygge og begrense skadevirkningene ved brann, eksplosjon og annen ulykke`)**: Juohkehaš lea geatnegas čájehit dábálaš várrogasvuođa (*alminnelig aktsomhet*) ja láhttet nu ahte buollin, bávkkáhus ja eará lihkohisvuohta eastaduvvo[^lovdata-lov-2002-06-14-20]. Buollima dahje lahkanan vára oktavuođas galgá juohkehaš **dallánaga dieđihit daidda, geat leat váras**, ja dárbbu mielde **dieđihit heahtealárbmaguovddážii** (*varsle nødalarmeringssentral*), sihke návccaid mielde dahkat dan mii lea vejolaš vahágiid ráddjemii[^lovdata-lov-2002-06-14-20].\n- **Eastadeaddji sihkkarastindooaimmat ja máŧasdoallu (`§ 6. Forebyggende sikringstiltak og vedlikehold`)**: Vistti eaiggát (*eier av byggverk*) lea geatnegas fuolahit dárbbašlaš sihkkarastindoaimmaid buollima eastadeapmái ja ráddjemii[^lovdata-lov-2002-06-14-20]. Sihke vistti **eaiggát ja geavaheaddji** (*eier og bruker*) leat geatnegasat doallat huksenteknihkalaš konstrukšuvnnaid, sihkarvuođarusttegiid ja eará sihkkarastindoaimmaid dohkálaš ortnegis (*i forsvarlig stand*) ja gozihit ahte dat juohke áigge doibmet ulbmila mielde[^lovdata-lov-2002-06-14-20].\n- **Stuorra doalut (`§ 7. Tiltak ved store arrangementer`)**: Dat gii lea ovddasvástideaddji stuorra doaluin, čájáhusain, čájálmasain, čoahkkimiin ja eará dilálašvuođain, galgá buori áiggis ovdal doaluid sáddet dieđu báikkálaš bearráigeahččoeiseváldái (*lokal tilsynsmyndighet*), jos doalut lágiduvvojit visttis dahje guovllus mii dábálaččat ii geavahuvvo dakkár doaluide[^lovdata-lov-2002-06-14-20].\n- **Vuogádatlaš dearvvašvuođa-, biras- ja sihkarvuođabargu (`§ 8. Systematisk helse-, miljø- og sikkerhetsarbeid`)**: Doaimmahagat (*virksomheter*) leat geatnegasat čađahit vuogádatlaš DBS-barggu (*internkontroll*) sihkkarastin dihte ahte lága gáibádusat čuvvojuvvojit, ja dat galgá sáhttit duođaštuvvot bearráigeahččoeiseválddiide[^lovdata-lov-2002-06-14-20].\n- **Erenoamáš buollinčuozáhagat (`§ 13. Særskilte brannobjekter`)**: Suohkan galgá identifiseret, čállit logahallama ja čađahit bearráigeahču (*tilsyn*) visttiin ja doaimmahagain gos buollin sáhttá dagahit ahte máŋga heakka duššet dahje šaddet stuorra vahágat dearvvašvuhtii, birrasii dahje ávnnaslaš árvvuide[^lovdata-lov-2002-06-14-20].\n\n### 1.2 Buollineastadeami láhkaásahus (*Forskrift om brannforebygging, FOR-2015-12-17-1710*)\n\nLáhkaásahus [Forskrift om brannforebygging (FOR-2015-12-17-1710)](/references/lovdata-brannforebygging.md) bođii fápmui 1.1.2016 ja dárkkilastá juohkehačča, vistti eaiggáda, vistti geavaheaddji ja suohkana buollineastadangeatnegasvuođaid[^lovdata-for-2015-12-17-1710] [^dsb-veiledning-brannforebygging]:\n\n- **Dábálaš várrogasvuođa gáibádusat ja dolastallan olgun (`§ 3. Generelle krav til aktsomhet`)**: Lea gildojuvvon cahkkehit dola dahje gieđahallat buollinváralaš dávviriid olgun dakkár dilis dahje dakkár vugiin ahte dat sáhttá dagahit buollima[^lovdata-for-2015-12-17-1710]. Cahkkehuvvon dola ii oaččo guođđit ovdal go dat lea oalát časkaduvvon (*fullstendig slokket*)[^lovdata-for-2015-12-17-1710]. Áigodagas **cuoŋománu 15. beaivvis čakčamánu 15. beaivái** (*15. april til 15. september*) lea gildojuvvon cahkkehit dola dahje gieđahallat buollinváralaš dávviriid vuovddis ja eará meahcis (*i eller i nærheten av skog og annen utmark*), earret go suohkan lea addán lobi, suohkanstivra lea báikkálaš láhkaásahusa bokte suovvan dan, dahje lea čielggas ahte buollin ii sáhte čuožžilit[^lovdata-for-2015-12-17-1710]. Go buollinvárra lea erenoamáš stuoris, sáhttá suohkan ásahit erenoamáš dolastallangildosa gitta **60 beaivái**[^lovdata-for-2015-12-17-1710]. Dát njuolggadus guoská njuolga mánáidgárddiid meahcce- ja dolastallanmátkkiide[^lovdata-for-2015-12-17-1710].\n- **Vistti eaiggáda geatnegasvuođat (`Kapittel 2, §§ 4–10`)**: Reguleret eaiggáda máhtu ja diehtojuohkima (`§ 4`), huksendeliid ja sihkarvuođarusttegiid dárkkisteami ja máŧasdoalu (`§ 5`), liggengaskaomiid (*fyringsanlegg*, `§ 6`), ásodagaid ja astoáigevistiid suovvadieđiheddjiid ja časkadanrusttegiid (`§ 7`), boares vistiid ođasmahttima (`§ 8`), eaiggáda vuogádatlaš sihkarvuođabarggu (`§ 9`) ja eaiggáda dokumentašuvnna (`§ 10`)[^lovdata-for-2015-12-17-1710].\n- **Vistti geavaheaddji geatnegasvuođat (`Kapittel 3, §§ 11–13`)**: Reguleret vistti buollindorvvolaš geavaheami (`§ 11`), geavaheaddji vuogádatlaš sihkarvuođabarggu (`§ 12`) ja geavaheaddji dokumentašuvnna (`§ 13`)[^lovdata-for-2015-12-17-1710].\n\n### 1.3 Siskkáldas bearráigeahču láhkaásahus (*Internkontrollforskriften, FOR-1996-12-06-1127*)\n\nLáhkaásahus [Internkontrollforskriften (FOR-1996-12-06-1127)](/references/lovdata-internkontroll.md) (`Forskrift om systematisk helse-, miljø- og sikkerhetsarbeid i virksomheter`) guoská buot doaimmahagaide mat gullet earret eará bargobiraslága (*arbeidsmiljøloven, lov 17. juni 2005 nr. 62*) ja buollin- ja bávkkáhanvárjaluslága (*brann- og eksplosjonsvernloven, lov 14. juni 2002 nr. 20*) siskkožii (`§ 2`)[^lovdata-for-1996-12-06-1127] [^arbeidstilsynet-internkontroll].\n\n- **Ovddasvástádus ja mieldeváikkuheapmi (`§ 4`)**: Dat gii lea ovddasvástideaddji doaimmahagas galgá fuolahit ahte siskkáldas bearráigeahčču ásahuvvo ja čađahuvvo ovttasbarggus bargiiguin ja sin ovddasteddjiiguin[^lovdata-for-1996-12-06-1127]. Bargit galget váikkuhit mielde (*medvirke*)[^lovdata-for-1996-12-06-1127].\n- **Siskkáldas bearráigeahču 8 váldočuoggá ja čálalaš dokumentašuvdnagáibádus (`§ 5`)**: Siskkáldas bearráigeahčču galgá heivehuvvot doaimmahaga šládjii, doaimmaide, várrodillái ja sturrodatdássái[^lovdata-for-1996-12-06-1127]. Láhkaásahusa `§ 5` nuppi lađđasa tabealla mielde galget čuoggát **4–8** alo dokumenterejuvvot čálalaččat (*må dokumenteres skriftlig*)[^lovdata-for-1996-12-06-1127]:\n  1. Fuolahit ahte gustovaš DBS-lágat ja -láhkaásahusat leat olámuttos, ja atnit bajilgova earenoamáš dehálaš gáibádusain[^lovdata-for-1996-12-06-1127].\n  2. Fuolahit ahte bargiin leat doarvái máhtut ja gálggat vuogádatlaš DBS-barggus, maiddái dieđut rievdadusaid birra[^lovdata-for-1996-12-06-1127].\n  3. Fuolahit ahte bargit váikkuhit mielde nu ahte oppalaš máhttu ja vásáhusat ávkkástallojuvvojit[^lovdata-for-1996-12-06-1127].\n  4. **Mearridit DBS-mihtuid** — *galgá dokumenterejuvvot čálalaččat* (*må dokumenteres skriftlig*)[^lovdata-for-1996-12-06-1127].\n  5. **Atnit bajilgova doaimmahaga organisašuvnnas, dás maiddái mo ovddasvástádus, barggut ja váldi DBS-barggus leat juhkkojuvvon** — *galgá dokumenterejuvvot čálalaččat*[^lovdata-for-1996-12-06-1127].\n  6. **Kártet váraid ja váttisvuođaid, árvvoštallat riskka ja ráhkadit plánaid ja doaimmaid riskkaid unnidit** — *galgá dokumenterejuvvot čálalaččat*[^lovdata-for-1996-12-06-1127].\n  7. **Álggahit rutiinnaid mat gávnnahit, njulget ja eastadit láhkarihkkumiid ja spiehkastagaid** — *galgá dokumenterejuvvot čálalaččat*[^lovdata-for-1996-12-06-1127].\n  8. **Čađahit vuogádatlaš goziheami ja siskkáldas bearráigeahču čađageahču sihkkarastin dihte ahte dat doaibmá eaktuduvvon láhkai** — *galgá dokumenterejuvvot čálalaččat*[^lovdata-for-1996-12-06-1127].\n\n### 1.4 Huksenteknihkalaš láhkaásahus (*Byggteknisk forskrift — TEK17, FOR-2017-06-19-840*)\n\nLáhkaásahus [Byggteknisk forskrift (TEK17, FOR-2017-06-19-840)](/references/lovdata-tek17-kap11.md) (`Kapittel 11. Sikkerhet ved brann`) mearrida teknihkalaš funkšuvdnagáibádusaid ja Huksenkvalitehta direktoráhta (*DiBK*) bagadus addá ovddalgihtii dohkkehuvvon buktagiid (*preaksepterte ytelser*) visttiid buollinsihkarvuhtii, risikoklássaide (`§ 11-2`), buollinklássaide (`§ 11-3`), báhtareapmái ja gádjumii (`§§ 11-11 til 11-14`) sihke manuála časkadeapmái (`§ 11-16`)[^lovdata-for-2017-06-19-840] [^dibk-tek17-11-2].\n\n### 1.5 Mánáidgárdeláhka ja láhkaásahus dearvvašvuođa ja birrasa birra mánáidgárddiin, skuvllain ja SFO:s (*Barnehageloven og Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger*)\n\nBuollinláhkavuođu lassin gustojit mánáidgárdesuorggi iežas dearvvašvuođa-, biras- ja gearggusvuođanjuolggadusat[^helsedir-helse-miljo-4] [^helsedir-helse-miljo-14] [^udir-sikkerhet-beredskap]:\n\n- **Dearvvašvuođa dáfus dohkálaš doaibma (`§ 4. Helsemessig tilfredsstillende virksomhet`)**: Mánáidgárddi lanjat ja olgoguovllut galget ovddidit dearvvašvuođa, trivsela, stoahkama ja oahppama buot mánáide, váldit vuhtii mánáid geain lea doaibmahehttehus (*funksjonsnedsettelse*), ja eastadit dávddaid, roasuid, lihkohisvuođaid, veahkaválddi ja **eará duođalaš dáhpáhusaid** (*andre alvorlige hendelser*)[^helsedir-helse-miljo-4].\n- **Gearggusvuohta, vuosttašveahkki ja sihkarvuođarusttegat (`§ 14. Beredskap, førstehjelp og sikkerhetsutstyr`)**: Doaimmahagas galget leat plánat ja rutiinnat roasuid, lihkohisvuođaid ja eará duođalaš dáhpáhusaid eastadeapmái ja gieđahallamii[^helsedir-helse-miljo-14]. Dearvvašvuođadirektoráhta bagadus čielggada ahte **buollin** (*brann*) lea okta dáin duođalaš dáhpáhusain, ja ahte plánat ja rutiinnat fertejit vuođđuduvvot **riska- ja rašesvuođaanalysii** (*risiko- og sårbarhetsanalyse — ROS-analyse*) ja gullat doaimmahaga siskkáldas bearráigeahččovuogádahkii[^helsedir-helse-miljo-14] [^udir-sikkerhet-beredskap]. Rutiinnat ja sihkarvuođarusttegiid sajádat galget leat oahppásat sihke bargiide ja mánáide, ja bargiin galgá leat heivehuvvon oahpahus rusttegiid geavaheamis ja vuosttašveahkis[^helsedir-helse-miljo-14].\n- **Siskkáldas bearráigeahčču (`§ 18. Internkontroll`)**: Mánáidgárddis galgá leat vuogádatlaš siskkáldas bearráigeahčču mii lea čielggaduvvon Oahpahusdirektoráhta (*Udir*) ja Dearvvašvuođadirektoráhta bagadusain[^helsedir-helse-miljo-18] [^udir-internkontroll]. Doaimmahaga eaiggádis (*virksomhetens eier*, jfr. `§ 3`) lea bajimus ovddasvástádus siskkáldas bearráigeahčus ja dárbbašlaš resurssaid juolludeamis, vaikko barggut sáhttet juohkásit ja delegerejuvvot[^helsedir-helse-miljo-18].\n\n---\n\n## 2. Ovddasvástádusjuohku — Eaiggát vs. Geavaheaddji (*Ansvarsfordeling: Byggeier vs. Bruker*)\n\n[Brann- og eksplosjonsvernloven (LOV-2002-06-14-20)](/references/lovdata-brann-eksplosjonsvernloven.md) `§ 6` ja [Forskrift om brannforebygging (FOR-2015-12-17-1710)](/references/lovdata-brannforebygging.md) `Kapittel 2 (§§ 4–10)` ja `Kapittel 3 (§§ 11–13)` juohket buollinvárjalusa geatnegasvuođaid čielgasit **vistti eaiggáda** (*eier av byggverk*) ja **vistti geavaheaddji** (*bruker av byggverk / barnehagevirksomheten*) gaskkas[^lovdata-lov-2002-06-14-20] [^lovdata-for-2015-12-17-1710].\n\n### 2.1 Guovddáš doahpagat ja rollat DSB bagadusa mielde\n\n- **Vistti eaiggát (*Eieren*)**: DSB bagadusa (`Veiledning til § 10`) mielde lea eaiggát dat geas lea visttiopmodaga vuođđogirjevuoigatvuohta (*den som har grunnbokshjemmelen til byggverket*)[^dsb-veiledning-brannforebygging]. Suohkanlaš mánáidgárddiin lea suohkan dávjá sihke vistti eaiggát ja geavaheaddji, muhto priváhta mánáidgárddiin dahje láigovisttiin sáhttá vistti eaiggát leat eará fitnodat go mánáidgárdedoaimmahat[^dsb-faq-brannforebygging] [^helsedir-helse-miljo-18].\n- **Vistti geavaheaddji (*Brukeren*)**: Geavaheaddji lea dat geas lea vuoigatvuohta geavahit vistti (*den som har rett til å bruke byggverket*)[^lovdata-for-2015-12-17-1710]. DSB čielggada ahte jus visti láigojuvvo viidáseappot (*fremleie*), de geavaheaddji lea láigogollosa maŋimus lađas — dat gii duođai geavaha vistti beaivválaččat[^dsb-faq-brannforebygging]. Eaiggádis lea ovddasvástádus sihkkarastit ahte dieđut vistti buollinsihkarvuođa gáibádusaid ja iešvuođaid birra ollejit gitta duohta geavaheaddjái[^dsb-faq-brannforebygging].\n- **Doaimmahat (*Virksomhet*)**: DSB čujuha dasa ahte `Brann- og eksplosjonsvernloven § 4 bokstav f` defineren doahpagii *\"virksomhet\"* fátmmasta juohke almmolaš ja priváhta fitnodaga beroškeahttá das leago fitnodat ásahuvvon gávppálaš vuoittu várás vai ii, nu ahte buot mánáidgárddit gullet doaimmahatgáibádusaid (`§§ 9–10` ja `§§ 12–13`) vuollái[^dsb-faq-brannforebygging] [^dsb-veiledning-brannforebygging].\n- **Buollinvárjalusjođiheaddji (*Brannvernleder*) ja ovddasvástádusa delegeren**: Gustovaš `Forskrift om brannforebygging (FOR-2015-12-17-1710)` ii geavat láhkateavsttas sierra virgenamahusa *\"brannvernleder\"*, muhto bidjá juridihkalaš geatnegasvuođa njuolga **doaimmahahkii** (*virksomheten*) eaiggádin (`§ 9`) ja geavaheaddjin (`§ 12`)[^lovdata-for-2015-12-17-1710]. Seammás gáibida [Internkontrollforskriften (FOR-1996-12-06-1127)](/references/lovdata-internkontroll.md) `§ 5 nr. 5` ja `Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger § 18` ahte doaimmahat galgá čálalaččat dokumenterejuvvon bajilgovas čájehit **mo ovddasvástádus, barggut ja váldi leat juhkkojuvvon** organisašuvnnas[^lovdata-for-1996-12-06-1127] [^helsedir-helse-miljo-18]. Mánáidgárddis sáhttet praktihkalaš buollinvárjalusbarggut delegerejuvvot mánáidgárdejođiheaddjái (*styrer*) dahje nammaduvvon buollinvárjalusovddasteaddjái, muhto bajimus juridihkalaš ovddasvástádus bissu alo doaimmahaga ovddasvástideaddjis[^lovdata-for-1996-12-06-1127] [^helsedir-helse-miljo-18].\n\n### 2.2 Ovddasvástádusjuogu struktuvra (Mermaid-govus)\n\n```mermaid\nflowchart TD\n    L[\"Brann- og eksplosjonsvernloven (§§ 6, 8) & Forskrift om brannforebygging\"] --> E[\"Vistti eaiggát / Eier av byggverk (Kap. 2, §§ 4–10)\"]\n    L --> B[\"Vistti geavaheaddji / Bruker — Mánáidgárdedoaimmahat (Kap. 3, §§ 11–13)\"]\n\n    E --> E1[\"Máhttu ja diehtojuohkin geavaheaddjái (§ 4)\"]\n    E --> E2[\"Huksendeliid ja sihkarvuođarusttegiid dárkkisteapmi ja máŧasdoallu (§ 5)\"]\n    E --> E3[\"Liggengaskaomiid / fyringsanlegg máŧasdoallu ja dieđihanplikt (§ 6)\"]\n    E --> E4[\"Boares vistti sihkarvuođadási ođasmahttin 1984-dássái (§ 8)\"]\n    E --> E5[\"Eaiggáda vuogádatlaš sihkarvuođabargu ja dokumentašuvdna (§§ 9–10)\"]\n\n    B --> B1[\"Buollindorvvolaš geavaheapmi ja rabas báhtarangeainnut (§ 11)\"]\n    B --> B2[\"Dieđihanplikt eaiggádii rievdadusaid ja vahágiid birra (§ 11)\"]\n    B --> B3[\"Dallánaga erenoamáš doaimmat go buollinsihkarvuohta hedjona (§ 11)\"]\n    B --> B4[\"Geavaheaddji vuogádatlaš sihkarvuođabargu: báhtareapmi, oahpahus ja diehtojuohkin (§ 12)\"]\n    B --> B5[\"Geavaheaddji dokumentašuvdna ja DBS-ovddasvástádusjuohku (§ 13 & Internkontrollforskriften § 5)\"]\n\n    E1 <-->|\"Ovttasbargu, láigošiehtadus ja oktasaš geavaheami buohtalastin (§ 4, § 11)\"| B2\n```\n\n### 2.3 Veardádallantabealla: Eaiggáda ja geavaheaddji láhkageatnegasvuođat\n\n| Suorgi / Fáddá | Vistti eaiggát (*Eier av byggverk*) — `Forskrift om brannforebygging §§ 4–10` | Vistti geavaheaddji (*Bruker / Mánáidgárdi*) — `Forskrift om brannforebygging §§ 11–13` |\n| --- | --- | --- |\n| **Máhttu ja diehtojuohkin** | Galgá dovdat vistti buollinsihkarvuođa gáibádusaid ja buot huksendeliid, installašuvnnaid ja rusttegiid mat galget fuomášit buollima dahje ráddjet dan váikkuhusaid (`§ 4`)[^lovdata-for-2015-12-17-1710]. Galgá oahpásmahttit geavaheaddji geavahangáibádusaiguin ja vistti buollinsihkarvuođa iešvuođaiguin[^lovdata-for-2015-12-17-1710]. | Galgá fuolahit ahte buohkat geain lea bargosadji visttis ožžot doarvái máhtu ja gálggaid buollima eastadit ja časkadit, ja ahte buohkat geat orodit visttis ožžot doarvái dieđuid (`§ 12`)[^lovdata-for-2015-12-17-1710]. |\n| **Oktasaš geavaheami buohtalastin (*Samordning*)** | Jus máŋggas geavahit seamma vistti, de eaiggát galgá sihkkarastit ahte buot geavaheapmi buohtalastojuvvo (*samordnes*) nu ahte buollin eastaduvvo (`§ 4`)[^lovdata-for-2015-12-17-1710]. | Galgá geavahit vistti gustovaš buollinsihkarvuođa gáibádusaid mielde ja dieđihit eaiggádii rievdadusaid, billašumiid ja vahágiid birra (`§ 11`)[^lovdata-for-2015-12-17-1710]. |\n| **Teknihkalaš dárkkisteapmi ja máŧasdoallu** | Galgá fuolahit ahte huksendelit, installašuvnnat ja rusttegat dárkkistuvvojit ja máŧasdollojuvvojit nu ahte dat devdet gáibádusaid ja doibmet sihke oktonassii ja ovttas (`§ 5`)[^lovdata-for-2015-12-17-1710]. Galgá dieđihit suohkanii ođđa dollasaji (*ildsted*) dahje liggengaskaomiid stuorra rievdadusaid birra ja giddet rusttega dallánaga jus boasttuvuohta lasiha buollinvára (`§ 6`)[^lovdata-for-2015-12-17-1710]. | Galgá garvit dárbbašmeahttun buollinvára ja fuolahit ahte **báhtarangeainnut doalahit doaibmanávccaid**, dás maiddái ahte **johtilvuohta / beassanlági ii hehttejuvvo** (*at fremkommeligheten ikke reduseres*, `§ 11`)[^lovdata-for-2015-12-17-1710]. |\n| **Boares vistti ođasmahttin ja erenoamáš doaimmat** | Galgá ođasmahttit boares vistti sihkarvuođadási nu ahte dat unnimusat vástida *byggeforskrift 15. november 1984 nr. 1892* dahje maŋit njuolggadusaid dási, nu guhkás go dat lea praktihkalaččat ja ekonomalaččat dohkálaš (`§ 8`)[^lovdata-for-2015-12-17-1710]. | Dakkár dilálašvuođain mat mearkkašahtti láhkai unnidit buollinsihkarvuođa, galgá geavaheaddji **dallánaga čađahit erenoamáš doaimmaid** dassážii go riska lea normaliserejuvvon (*straks gjennomføre ekstraordinære tiltak inntil risikoen er normalisert*, `§ 11`)[^lovdata-for-2015-12-17-1710]. |\n| **Vuogádatlaš sihkarvuođabargu ja spiehkastagat** | Galgá bidjat mihtuid, plánaid ja rutiinnaid mat sihkkarastet ahte vistti gáibádusat čuvvojuvvojit, ja mat gávnnahit, njulget ja eastadit váilevašvuođaid huksendeliin, sihkarvuođarusttegiin ja vuogádatlaš sihkarvuođabarggus (`§ 9`)[^lovdata-for-2015-12-17-1710]. | Galgá bidjat mihtuid, plánaid ja rutiinnaid buollinvára unnidit: dorvvolaš geavaheapmi, **báhtaran- ja gádjunrutiinnat**, bargiid oahpahus, diehtojuohkin ja vuogádatlaš sihkarvuođabarggu váilevašvuođaid njulgen (`§ 12`)[^lovdata-for-2015-12-17-1710] [^dsb-veiledning-brannforebygging]. |\n| **Dokumentašuvdna** | Galgá duođaštit čálalaččat ahte geatnegasvuođat `§§ 4–9` mielde leat devdojuvvon (`§ 10`)[^lovdata-for-2015-12-17-1710]. | Galgá duođaštit čálalaččat ahte geatnegasvuođat `§§ 11–12` mielde leat devdojuvvon (`§ 13`)[^lovdata-for-2015-12-17-1710]. |\n\n---\n\n## 3. Teknihkalaš gáibádusat ja risikoklássa (*Byggtekniske krav og risikoklassifisering etter TEK17*)\n\n[Byggteknisk forskrift (TEK17, FOR-2017-06-19-840)](/references/lovdata-tek17-kap11.md) `§ 11-1` mearrida ahte visttit galget prošekterejuvvot ja huksejuvvot nu ahte olahuvvo duhtadeaddji buollinsihkarvuohta olbmuide geat orodit visttis, ja nu ahte lea duhtadeaddji vejolašvuohta gádjut olbmuid ja čađahit beaktilis časkadanbarggu[^lovdata-for-2017-06-19-840].\n\n### 3.1 Risikoklássat (*Risikoklasser — TEK17 § 11-2*)\n\n`TEK17 § 11-2` mielde galget visttit dahje vistti iešguđet geavahanguovllut biddjojuvvot **risikoklássaide 1–6** (*risikoklasser*) dan mielde makkár áitta buollin sáhttá leat heggii ja dearvvašvuhtii[^lovdata-for-2017-06-19-840]. Risikoklássat biddjojuvvojit vuođđun báhtareami ja gádjuma sihkkarastimii[^lovdata-for-2017-06-19-840]:\n\n| Risikoklássa (*Risikoklasse*) | Visti lea oaivvilduvvon dušše sporádalaš olbmuid orodeapmái (*Byggverk kun beregnet for sporadisk personopphold*) | Olbmot visttis dovdet báhtarandiliid ja báhtarangeainnuid, ja sáhttet ieža gádjut iežaset (*Personer i byggverk kjenner rømningsforhold... og kan bringe seg selv i sikkerhet*) | Visti lea oaivvilduvvon idjadeapmái (*Byggverk beregnet for overnatting*) | Eaktuduvvon geavaheapmi mielddisbuktá unna buollinvára (*Forutsatt bruk av byggverk medfører liten brannfare*) |\n| --- | --- | --- | --- | --- |\n| **1** | ja | ja | nei | ja |\n| **2** | ja/nei | ja | nei | nei |\n| **3** | nei | ja | nei | ja |\n| **4** | nei | ja | ja | ja |\n| **5** | nei | nei | nei | ja |\n| **6** | nei | nei | ja | ja |\n\nDiBK `Veiledning til TEK17 § 11-2` (*Preaksepterte ytelser*) mearrida ahte doaimmahagat galget biddjojuvvot risikoklássaide bagadusa `§ 11-2 Tabell 1` (*Ulike virksomheter og tilhørende risikoklasse*) mielde[^dibk-tek17-11-2]. Doaimmahagat mat eai leat namuhuvvon `Tabell 1` siste, biddjojuvvojit risikoklássii láhkaásahusa `Tabell: Risikoklasser` árvvoštallama vuođul, man ovddasvástideaddji prošekterejeaddji (*ansvarlig prosjekterende*) ferte ákkastallat ja dokumenteret[^dibk-tek17-11-2]. Bagadus deattuha maiddái ahte doaibma mii árbevirolaččat gullá dihto risikoklássii, sáhttá spiehkastahkan ja erenoamáš árvvoštallama maŋŋá biddjojuvvot vuolit risikoklássii jus visttis leat unnán olbmot ja visti lea heivehuvvon johtilis ja álkis báhtareapmái[^dibk-tek17-11-2]. (Geahča maiddái čuoggá 5.3 *Intermission*-dárkkisteami várás `§ 11-2 Tabell 1` oassečuoggá birra[^dibk-tek17-11-2].)\n\n### 3.2 Buollinklássat (*Brannklasser — TEK17 § 11-3*)\n\n`TEK17 § 11-3` mielde galget visttit dahje vistti iešguđet oasit biddjojuvvot **buollinklássaide 1–4** (*brannklasser*) dan váikkuhusa (*konsekvens*) mielde man buollin sáhttá dagahit heggii, dearvvašvuhtii, servodatlaš beroštumiide ja birrasii[^lovdata-for-2017-06-19-840]. Buollinklássat stivrejit vistti guoddinmáhtu ja dássedisvuođa (*bæreevne mv.*) buollima oktavuođas[^lovdata-for-2017-06-19-840]:\n\n| Buollinklássa (*Brannklasse*) | Váikkuhus (*Konsekvens*) |\n| --- | --- |\n| **1** | Unni (*Liten*) |\n| **2** | Gaskamearálaš (*Middels*) |\n| **3** | Stuoris (*Stor*) |\n| **4** | Erenoamáš stuoris (*Særlig stor*) |\n\nDiBK `Veiledning til TEK17 § 11-3` čilge ahte buollima váikkuhus lea čadnojuvvon vistti eaktuduvvon geavaheapmái (*risikoklasse*), olbmuid lohkui, vistti sturrodahkii (geardelohkui ja areálii), plánalovttii ja buollinenergiijai[^dibk-tek17-11-3].\n\n### 3.3 Báhtareapmi, buollinseallat ja báhtarangeainnut (*Rømning, brannceller og rømningsveier — TEK17 §§ 11-11, 11-13 og 11-14*)\n\n1. **Báhtaranáigi ja doaibmahehttehusat (`§ 11-11. Generelle krav om rømning og redning`)**:\n   - Visttit galget prošekterejuvvot ja huksejuvvot johtilis ja dorvvolaš báhtareapmái ja gádjumii, ja galgá váldojuvvot vuhtii olbmuide geain lea doaibmahehttehus (*personer med funksjonsnedsettelse*)[^lovdata-for-2017-06-19-840].\n   - Olámuttos báhtaranáigi (*den tiden som er tilgjengelig for rømning*) galgá leat guhkit go dárbbašlaš báhtaranáigi (*den tiden som er nødvendig for rømning*), ja gaskkas galgá leat duhtadeaddji sihkarvuođamarginala (*sikkerhetsmargin*)[^lovdata-for-2017-06-19-840].\n   - Báhtarandoalli (*fluktvei*) orodansajis buollinsealla olggosmannamii galgá leat čielggas, eastagiid haga (*uten hindringer*) ja nu unnán guovlorievdadusaiguin go vejolaš[^lovdata-for-2017-06-19-840] [^dibk-tek17-11-11].\n2. **Olggosmannan buollinseallas (`§ 11-13. Utgang fra branncelle`)**:\n   - Buollinseallas (*branncelle*) galgá leat unnimusat okta olggosmannan oadjebas báikái (*utgang til sikkert sted*), dahje olggosmannamat **guovtti sorjjasmeahttun báhtarangeidnui** (*to uavhengige rømningsveier*), dahje okta olggosmannan báhtarangeidnui mas leat guokte molssaevttolaš báhtaranguovllu[^lovdata-for-2017-06-19-840].\n   - Jus buollinseallas leat máŋga gearddi dahje gaskageardi (*mellometasje*), galgá leat unnimusat okta olggosmannan juohke gearddis[^lovdata-for-2017-06-19-840]. Visttiin mat leat `risikoklasse 1, 2, 3 og 4`, sáhttá olggosmannan eará gearddiin go sisabeassangearddis leat láse mii lea heivehuvvon dorvvolaš báhtareapmái (*vindu som er tilrettelagt for sikker rømning*)[^lovdata-for-2017-06-19-840].\n   - Vuollegis visttiin (*lave byggverk*) mat leat oaivvilduvvon doaimmaide `risikoklasse 1, 2, 3 og 4`, sáhttá olggosmannan buollinseallas doalvut njuolga oadjebas báikái dahje báhtarangeidnui mas lea dušše okta báhtaranguovlu, eaktudettiin ahte juohke buollinseallas leat lásat mat leat hábmejuvvon ja heivehuvvon dorvvolaš báhtareapmái[^lovdata-for-2017-06-19-840].\n3. **Uvsat báhtarangeainnus (`§ 11-13 (7)` ja `§ 11-14. Rømningsvei`)**:\n   - Báhtarangeaidnu galgá leat sierra buollinsealla (*egen branncelle*) ja doalvut čielga ja álkit áddehahtti láhkai oadjebas báikái[^lovdata-for-2017-06-19-840].\n   - Uksa báhtarangeidnui galgá leat doarvái govdat ja allat, ja dat galgá leat **álki rahpat čoavdaga geavaheami haga** (*lett å åpne uten bruk av nøkkel*)[^lovdata-for-2017-06-19-840].\n   - Uksa galgá rahpasit báhtaranguvlui (*slå ut i rømningsretningen*), muhto sáhttá rahpasit báhtaranguovllu vuostá jus ii leat báhtareaddjiid čoahkkáibáhkkema várra (*fare for oppstuving*)[^lovdata-for-2017-06-19-840].\n   - DiBK `Veiledning til TEK17 § 11-14` deattuha ahte gáibádus uvssa rahpanfápmui (*åpningskraft*) gusto maiddái dalle go buollinalárbma lea buollán; dat mielddisbuktá dábálaččat ahte iešgiddedeaddji uvsain (*selvlukkende dører med dørpumpe*) ferte leat uksaautomatihkka (*dørautomatikk*) ja boatkankeahtes elrávdnjefállan (**UPS** — *Uninterruptible Power Supply*) gitta uksii[^dibk-tek17-11-12]. Visttiin mat gullet `risikoklasse 5 og 6`, galget uvsat báhtarangeainnus sáhttit rahppojuvvot manuálalaččat ovttain dohppemiin ja čoavdaga haga (omd. panihkkabierggas `NS-EN 1125:2008` mielde)[^dibk-tek17-11-12].\n\n### 3.4 Buollinalárbma, láidestallanvuogádat ja manuála časkadanrusttegat (*Brannalarmanlegg, ledesystem og manuelt slokkeutstyr — TEK17 §§ 11-12 og 11-16*)\n\n- **Buollinalárbmarusttet (*Brannalarmanlegg — TEK17 § 11-12 (2)*)**:\n  - Visttiin mat leat oaivvilduvvon doaimmaide **`risikoklasse 2 til 6` galgá leat buollinalárbmarusttet** (*brannalarmanlegg*)[^lovdata-for-2017-06-19-840].\n  - DiBK `Veiledning til TEK17 § 11-12 Tabell 3` mielde gáibiduvvo `risikoklasse 2` ja `risikoklasse 3` visttiin main lea 1 geardi `Brannalarmkategori 1`, ja visttiin main leat 2 dahje eanet gearddit `Brannalarmkategori 2` (ollislaččat gokčevaš buollinalárbmarusttet optihkalaš suovvadetektoriiguin buot guovlluin)[^dibk-tek17-11-12].\n  - Visttiin mat leat oaivvilduvvon unnán olbmuide ja unnit sturrodatvisttiin sáhttet geavahuvvot **suovvadieđiheaddjit** (*røykvarslere*) jus báhtarandilit leat erenoamáš álkit ja čielgasat (*dersom rømningsforholdene er særlig enkle og oversiktlige*)[^lovdata-for-2017-06-19-840]. Dakkár suovvadieđiheaddjit galget leat čatnojuvvon elrávdnjefierpmádahkii (*tilknyttet strømforsyningen*), sis galgá leat báhtter várračovdosin (*batteri som reserveløsning*), ja jus buollinseallas dárbbašuvvojit máŋga suovvadieđiheaddji, de dat galget leat **ráidočatnojuvvon** (*seriekoblet*)[^lovdata-for-2017-06-19-840].\n- **Čuovga, merkejupmi ja láidestallanvuogádat (*Belysning, merking og ledesystem — TEK17 § 11-11 (6) og § 11-12 (3), (5)*)**:\n  - Visttiin gos báhtarandoalit ja báhtarangeainnut leat guhkit, main leat guovlorievdadusat dahje maid máŋga olbmo geavahit, galgá leat buorre čuovga ja čielga merkejupmi[^lovdata-for-2017-06-19-840]. Stuorra visttiin, visttiin mat leat oaivvilduvvon olu olbmuide ja visttiin `risikoklasse 5 og 6` siste galgá leat **láidestallanvuogádat** (*ledesystem*)[^lovdata-for-2017-06-19-840].\n  - Buollinteknihkalaš installašuvnnaid ja sihkarvuođarusttegiid sajádat (omd. manuála buollindieđiheaddjit, buollinsláŋŋgat, giehtačaskadeaddjit, buollinteppát ja erenoamáš báhtaranrusttegat doaibmahehttejuvvon olbmuide) galgá leat čielgasit merkejuvvon[^lovdata-for-2017-06-19-840] [^dibk-tek17-11-12].\n- **Manuála časkadanrusttegat (*Manuelt slokkeutstyr — TEK17 § 11-16 vs. Forskrift om brannforebygging § 7*)**:\n  - DiBK `Veiledning til TEK17 § 11-16` (*Preaksepterte ytelser*) mearrida ahte visttiin mat gullet **`risikoklasse 3, 5 og 6` gos lea deaddočáhci (*trykkvann*), galgá leat buollinsláŋŋga (*brannslange*)** (dahje giehtačaskadeaddjit jus ii leat doarvái čáhci)[^dibk-tek17-11-2]. Visttiin `risikoklasse 1, 2 og 4` galgá leat juogo giehtačaskadeaddji dahje heivvolaš buollinsláŋŋga mii olaha buot lanjaide[^dibk-tek17-11-2].\n  - Buollinsláŋŋga ja giehtačaskadeddjiid lohku ja gokčanguovlu galgá sihkkarastit ahte **buot lanjat olles visttis gokčojuvvojit**[^dibk-tek17-11-2].\n  - Giehtačaskadeaddjit (*håndslokkeapparater*) sáhttet DiBK bagadusa mielde leat **bulverapparáhtat unnimusat 6 kg ABC-bulveriin**, dahje **soahti- ja čáhceapparáhtat (*skum- og vannapparater*) unnimusat 9 lihtara dahje unnimusat 6 lihtara main lea beaktilvuođaklássa unnimusat `21A` standarda `NS-EN 3-7` mielde**[^dibk-tek17-11-2].\n  - Manuála časkadanrusttegiid sajádat galgá leat čielgasit merkejuvvon šilttaiguin mat leat **maŋŋelčuvgejeaddjit** (*etterlysende / fotoluminiscerende*) dahje **čuvgejuvvon heahtečuovggain** (*belyst med nødlys*), biddjojuvvon rastá johtolathámi (*på tvers av ferdselsretningen*), ja rusttegis galgá leat geavahanbagadus[^dibk-tek17-11-2].\n  - Ásodagain ja astoáigevistiin (*bolig og fritidsbolig* — omd. dábálaš ásodat gos jođihuvvo bearrašmánáidgárdi / *familiebarnehage*) gáibida [Forskrift om brannforebygging (FOR-2015-12-17-1710)](/references/lovdata-brannforebygging.md) `§ 7` unnimusat ovtta časkadanrusttega mii olaha buot lanjaide (hápmebissovaš buollinsláŋŋga unnimusat 10 mm siskkáldas čađamihtuin, bulverapparáhta unnimusat 6 kg ABC-bulveriin, soahti-/čáhceapparáhta unnimusat 9 lihtara, dahje soahti-/čáhceapparáhta unnimusat 6 lihtara `21A`), ja eaiggát galgá dárkkistit ja máŧasdoallat daid buvttadeaddji bagadusaid mielde[^lovdata-for-2015-12-17-1710].\n\n---\n\n## 4. Báhtaranplánat, hárjehallamat ja oahpahus (*Evakueringsplaner, brannøvelser og opplæring*)\n\nMánáidgárddis lea organisatoralaš buollinsihkarvuohta seamma dehálaš go teknihkalaš rusttegat, danne go smávva mánát leat sorjavaččat rávesolbmuid jođiheamis ja veahkis buollima oktavuođas[^lovdata-for-2015-12-17-1710] [^helsedir-helse-miljo-14] [^dibk-tek17-11-12].\n\n### 4.1 Báhtaranplánat ja báhtaranrutiinnat (*Evakueringsplaner og rømningsplaner*)\n\n- **Láhkagáibádus ovdal vistti atnuiváldima**: [Byggteknisk forskrift (TEK17, FOR-2017-06-19-840)](/references/lovdata-tek17-kap11.md) `§ 11-12 (4)` mearrida ahte visttiin `risikoklasse 5 og 6`, eará almmolaš visttiin ja **bargovisttiin (*arbeidsbygninger*) galget gávdnot báhtaranplánat (*evakueringsplaner*) ovdal go visti váldojuvvo atnui**[^lovdata-for-2017-06-19-840]. Seammás gáibida [Forskrift om brannforebygging (FOR-2015-12-17-1710)](/references/lovdata-brannforebygging.md) `§ 12` ja `Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger § 14` ahte doaimmahagas leat doaibmi báhtaran- ja gádjunrutiinnat mat vuođđuduvvet ROS-analysii[^lovdata-for-2015-12-17-1710] [^helsedir-helse-miljo-14] [^udir-sikkerhet-beredskap].\n- **Báhtaranplána sisdoallu DiBK bagadusa mielde (`Veiledning til TEK17 § 11-12 fjerde ledd`)**:\n  - **Bargogovvádus veahkehuvvon báhtareapmái (*assistert rømning*)**: Plánas galget leat čielgasit definerejuvvon barggut olbmuid veahkeheapmái geat dárbbašit veahki beassat olggos visttis, heivehuvvon iešguđetlágan doaibmahehttehusaide (*ulike typer funksjonsnedsettelse*) ja vejolaš erenoamáš báhtaranrusttegiidda[^dibk-tek17-11-12].\n  - **Hárjehallanplána (*Plan for øvelser*)**: Hárjehallamat fertejit leat **realisttalaččat veahkehuvvon báhtareami dáfus** (*realistiske med hensyn til assistert rømning*)[^dibk-tek17-11-12].\n  - **Báhtarangovvádagat (*Rømningsplaner*)**: Dát leat sárggusat mat čájehit plánejuvvon báhtarandoaliid, báhtarangeainnuid ja olggosmannamiid, časkadanrusttegiid ja manuála buollindieđiheddjiid sajádaga, oanehis buollininstrukšuvnna (*branninstruks*), symbolačilgehusa ja *\"Dás don čuoččut\"* (*\"Her står du\"*) -mearkka[^dibk-tek17-11-12].\n\n### 4.2 Bargiid oahpahus, ođđa bargit, vikárat ja buollinhárjehallamat\n\n- **Oahpahusgáibádus buot bargiide**: [Forskrift om brannforebygging (FOR-2015-12-17-1710)](/references/lovdata-brannforebygging.md) `§ 12` gáibida rutiinnaid mat sihkkarastet ahte **olbmuin geain lea bargosadji visttis** (*personer med arbeidsplass i byggverket*) leat doarvái máhtut ja gálggat buollima eastadit ja časkadit[^lovdata-for-2015-12-17-1710] [^dsb-veiledning-brannforebygging]. Dát fátmmasta sihke fásta bargiid, ođđa bargiid ja **gaskaboddosaš bargiid / vikáraid**[^lovdata-for-2015-12-17-1710] [^lovdata-for-1996-12-06-1127].\n- **Mánáid oahpásmuhttin**: `Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger § 14` mearrida ahte gearggusvuođarutiinnat ja sihkarvuođarusttegiid sajádat galget leat oahppásat sihke bargiide ja mánáide, ja ahte sii galget oažžut ahkái ja dárbbuide heivehuvvon oahpahusa[^helsedir-helse-miljo-14].\n- **Buollinhárjehallamat (*Brannøvelser*)**: DSB, Udir ja DiBK bagadusaid mielde leat jeavddalaš, realisttalaš hárjehallamat guovddáš oassi geavaheaddji vuogádatlaš sihkarvuođabarggus (`Forskrift om brannforebygging § 12`) ja gearggusvuođabarggus, ja hárjehallamiid vásáhusat ja spiehkastagat galget evaluerejuvvot ja dokumenterejuvvot siskkáldas bearráigeahčus[^lovdata-for-2015-12-17-1710] [^dibk-tek17-11-12] [^udir-sikkerhet-beredskap] [^helsedir-helse-miljo-18].\n\n### 4.3 Erenoamáš deattuhandilálašvuođat mánáidgárddiin ja davviguovlluid dálvediliin\n\n1. **Smávva mánát, oađđináigi ja veahkehuvvon báhtareapmi (*Småbarn og assistert rømning*)**: Smávvamánáidossodagain (*småbarnsavdelinger*) ođđet mánát beaivet juogo siste oađđinlanjain dahje olgun mánáidvovnnaide, eaige sáhte ieža báhtarit[^dibk-tek17-11-12] [^helsedir-helse-miljo-4]. Báhtaranplánat ja hárjehallamat fertejit danne vuhtii váldit veahkehuvvon báhtareami (*assistert rømning*), mánáid lohkama (*opptelling*), báhtaranvovnnaid dahje guoddinrutiinnaid, ja bargiid juohku oađđin- ja vuololeahkkáiggiid[^dibk-tek17-11-12] [^helsedir-helse-miljo-14].\n2. **Mánát geain lea doaibmahehttehus (*Barn med funksjonsnedsettelse*)**: Sihke `TEK17 § 11-11 (1)`, DiBK bagadus `§ 11-12 (4)` ja `Forskrift om helse og miljø i barnehager mv. § 4` gáibidit ahte mánáide geain lea doaibmahehttehus ráhkaduvvojit konkrehta báhtarančovdosat, bargogovvádusat ja dárbbu mielde sierra veahkkeneavvut[^lovdata-for-2017-06-19-840] [^dibk-tek17-11-12] [^helsedir-helse-miljo-4].\n3. **Davviguovlluid ja dálvediliid hástalusat (*Arktiske og vinterlige driftsforhold*)**:\n   - **Muohta ja jiekŋa báhtarangeainnuin**: `Forskrift om brannforebygging § 11` geatnegahttá geavaheaddji fuolahit ahte báhtarangeainnut doalahit doaibmanávccaid ja ahte johtilvuohta (*fremkommelighet*) ii unniduvvo[^lovdata-for-2015-12-17-1710]. Dálvet fertejit olggosbeassanuvsat, olgotráhppát ja báhtaranbálgát gitta čoahkkananbáikái (*oppmøtested*) bálkkistuvvot muohttagis ja čievrrasuvvot jieŋas juohke beaivve nu ahte uvsat rahpasit eastagiid haga[^lovdata-for-2015-12-17-1710] [^lovdata-for-2017-06-19-840].\n   - **Skábmadilli ja buolaš**: Skábmaáigge lea doaibmi čuovga ja heahtečuovga / láidestallanvuogádat (`TEK17 § 11-12 (3)`) dárbbašlaš olggosbáhtareapmái[^lovdata-for-2017-06-19-840]. Go mánát báhtarit olggos garrasit buollašis ilma olgobiktasiid haga, ferte báhtaranplánas leat čielga rutiinna liegga gokčasiidda/teppáide ja johtilis sirdimii lahka liegga suodjebáikái (*evakueringssted / sekundært oppmøtested*) maŋŋá go mánát leat lohkkojuvvon čoahkkananbáikkis[^lovdata-for-2015-12-17-1710] [^helsedir-helse-miljo-14].\n\n---\n\n## 5. Beroštupmi, geahčču ja eahpesihkarvuođat (*Tilsyn, avvikshåndtering og åpne punkter til Intermission*)\n\n### 5.1 Suohkanlaš bearráigeahčču (*Kommunalt tilsyn*)\n\nMánáidgárddiid buollin- ja gearggusvuođasihkarvuohta lea guovtti suohkanlaš bearráigeahččoeiseválddi vuolde:\n\n1. **Buollin- ja gádjunlágádusa bearráigeahčču (*Brann- og redningsvesenets tilsyn — Brann- og eksplosjonsvernloven § 13*)**:\n   - Suohkan identifisere ja čállá logahallama erenoamáš buollinčuozáhagain (*særskilte brannobjekter*, `§ 13 første ledd`) dahje mearrida bearráigeahču eará visttiin ovttaskas mearrádusa (*enkeltvedtak*) dahje báikkálaš láhkaásahusa (*lokal forskrift*) bokte (`§ 13 fjerde ledd`)[^lovdata-lov-2002-06-14-20].\n   - Bearráigeahčču fátmmasta buot beliid main lea mearkkašupmi buollinsihkarvuhtii: huksenteknihkalaš, teknihkalaš, rusttetlaš ja organisatoralaš buollinsihkkarastindoaimmaid sihke diliid mat váikkuhit časkadan- ja gádjunbargui (`§ 13 andre ledd`)[^lovdata-lov-2002-06-14-20].\n   - Jus suohkan ieš eaiggáduššá dahje geavaha vistti, de suohkan galgá sáhttit duođaštit guovddáš bearráigeahččoeiseváldái (*DSB*) mo bearráigeahčču lea čađahuvvon ja mo vejolaš gohččumat (*pålegg*) leat čuvvojuvvon (`§ 13 tredje ledd`)[^lovdata-lov-2002-06-14-20].\n2. **Birasrettaš dearvvašvuođasuodjalusa bearráigeahčču (*Tilsyn med miljørettet helsevern — Forskrift om helse og miljø i barnehager mv. §§ 18–19*)**:\n   - Suohkan goziha ahte mánáidgárdi deavdá `Forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger` gáibádusaid, dás maiddái gearggusvuođaplánaid (`§ 14`) ja siskkáldas bearráigeahču (`§ 18`)[^helsedir-helse-miljo-14] [^helsedir-helse-miljo-18].\n\n### 5.2 Spiehkastagaid gieđahallan (*Avvikshåndtering*) ja erenoamáš doaimmat\n\nSihke vistti eaiggát (`Forskrift om brannforebygging § 9`) ja geavaheaddji (`§ 12`), [Internkontrollforskriften (FOR-1996-12-06-1127)](/references/lovdata-internkontroll.md) `§ 5 nr. 7` ja `Forskrift om helse og miljø i barnehager mv. § 18` gáibidit čálalaš rutiinnaid spiehkastagaid (*avvik*) ja váilevašvuođaid (*mangler*) gávnnahit, njulget ja eastadit[^lovdata-for-2015-12-17-1710] [^lovdata-for-1996-12-06-1127] [^helsedir-helse-miljo-18]:\n\n- **Dábálaš spiehkastatgieđahallan**: Go mánáidgárdebargi fuomáša teknihkalaš dahje organisatoralaš váilevašvuođa (omd. uksagiddejeaddji mii ii gidde buollinuvssa, heahtečuovga mii ii buole, dahje dávvirat báhtarangeainnus), galgá dat registrerejuvvot siskkáldas bearráigeahču spiehkastatvuogádahkii, ja vistti eaiggát galgá oažžut dieđu `Forskrift om brannforebygging § 11 tredje strekpunkt` mielde jus váilevašvuohta guoská vistái dahje sihkarvuođarusttegiidda[^lovdata-for-2015-12-17-1710] [^lovdata-for-1996-12-06-1127].\n- **Dallánaga erenoamáš doaimmat (`Forskrift om brannforebygging § 11 fjerde strekpunkt`)**: Jus čuožžila dilli mii **mearkkašahtti láhkai unnidit buollinsihkarvuođa** (*forhold som vesentlig reduserer brannsikkerheten* — omd. buollinalárbmarusttet lea billašuvvan dahje okta báhtarangeaidnu lea giddejuvvon divodemiid geažil), de geavaheaddji lea lága mielde geatnegas **dallánaga čađahit erenoamáš doaimmaid dassážii go riska lea normaliserejuvvon** (*straks gjennomføre ekstraordinære tiltak inntil risikoen er normalisert*)[^lovdata-for-2015-12-17-1710].\n\n### 5.3 Gáldoerohusat, regulerennjuolggadusaid rájat ja rabas čuoggát *Intermission*-dárkkisteapmái\n\nVai olmmošlaš dárkkisteaddji (*human reviewer*) sáhttá dohkkehit ja dárkkistit vuođđuduvvon gálduid *Intermission*-dásis (`cli:verify`) ovdal Stage 2 oahppokurssa ráhkadeami, de čuovvovaš regulerennjuolggadusaid rájat ja rabas čuoggát čielggaduvvojit dás:\n\n1. **Mánáidgárddi (`Barnehage`) dárkilis gárvvesdohkkehuvvon gurgadas DiBK `Veiledning til TEK17 § 11-2 Tabell 1` ja `§ 11-3` tabeallain**:\n   - Láhkaásahusa `TEK17 § 11-2` tabealla ([Byggteknisk forskrift (TEK17, FOR-2017-06-19-840)](/references/lovdata-tek17-kap11.md)) čájeha eavttuid mat earuhit `risikoklasse 3` (olbmot dovdet báhtarandiliid ja sáhttet ieža gádjut iežaset, ii idjadeapmi) ja `risikoklasse 5` (olbmot eai dovdda báhtarandiliid dahje eai sáhte ieža gádjut iežaset, ii idjadeapmi)[^lovdata-for-2017-06-19-840]. DiBK neahttabagadusa (`dibk-tek17-11-2`) ohcanbohtosis oaidnit ahte `§ 11-2 Tabell 1: Ulike virksomheter og tilhørende risikoklasse` bidjá dihto doaimmahagaid risikoklássaide ja suovvá spiehkastahkan vuolit risikoklássa erenoamáš árvvoštallama vuođul[^dibk-tek17-11-2], muhto `Tabell 1` HTML-siiddu ohcanoassi boatkanii ovdal *\"Barnehage\"*-gurgadasa.\n   - **Ávžžuhus *Intermission*-dárkkisteapmái**: Olmmošlaš dárkkisteaddji sáhttá `dibk.no` `§ 11-2` ja `§ 11-3` HTML-siidduin rahpat `Tabell 1` (*Preaksepterte ytelser*) ja nannet guđe dárkilis risikoklássii ja buollinklássii (geardelogu/areála mielde) DiBK tabealla bidjá dábálaš mánáidgárddi ovdal Stage 2.\n2. **Buollinhárjehallamiid lohku jagis — Fásta lohku vs. Riskavuođđuduvvon funkšuvdnagáibádus (`Forskrift om brannforebygging § 12`)**:\n   - Ovddit njuolggadusat ja báikkálaš suohkanlaš bagadusat namuhit dávjá dihto logu buollinhárjehallamiid jagis (omd. unnimusat 1–2 dieđihuvvon dahje dieđihuvvokeahtes buollinhárjehallama jagis).\n   - Gustovaš [Forskrift om brannforebygging (FOR-2015-12-17-1710)](/references/lovdata-brannforebygging.md) `§ 12` ii doala fásta lohkogáibádusa láhkateavsttas, muhto lea hábmejuvvon **funkšuvdnagáibádussan mii galgá heivehuvvot buollinriskii** (*tilpasset risikoen for brann som følge av virksomhetens bruk av byggverket*)[^lovdata-for-2015-12-17-1710] [^dsb-veiledning-brannforebygging]. Stage 2 oahppokurssas berre čielgasit earuhit lága riskavuođđuduvvon funkšuvdnagáibádusa ja báikkálaš/fágalaš ávžžuhusaid hárjehallandávjodaga birra.\n3. **Ođđa mánáidgárdevisttit (`TEK17`) vs. Boares mánáidgárdevisttit (`Forskrift om brannforebygging § 8`)**:\n   - `TEK17` teknihkalaš gáibádusat gustojit ođđa visttiide ja váldooasis stuorra rievdadusaide dahje geavahanrievdadusaide (*bruksendring*)[^lovdata-for-2017-06-19-840], dan botta go boares, eksisterejeaddji mánáidgárdevisttiin gusto `Forskrift om brannforebygging § 8`, mii gáibida ođasmahttit sihkarvuođadási unnimusat *byggeforskrift 15. november 1984 nr. 1892* dássái praktihkalaš ja ekonomalaš dohkálaš rámma siskkožis (juogo huksenteknihkalaš dahje organisatoralaš riskaunnideaddji doaimmaiguin)[^lovdata-for-2015-12-17-1710].\n4. **Manuála časkadanrusttegat mánáidgárdevisttiin (`TEK17 § 11-16`) vs. Ásodagain / bearrašmánáidgárddiin (`Forskrift om brannforebygging § 7`)**:\n   - Dábálaš mánáidgárdevisttiin mat gullet `TEK17 § 11-16` (`risikoklasse 3, 5 og 6` gos lea deaddočáhci) gáibiduvvo **buollinsláŋŋga** (*brannslange*)[^dibk-tek17-11-2], dan botta go `Forskrift om brannforebygging § 7` (mii suovvá válljet buollinsláŋŋga, 6 kg ABC-bulverapparáhta, 9 l soahti-/čáhceapparáhta dahje 6 l `21A` soahti-/čáhceapparáhta gaskkas) guoská **ásodagaide ja astoáigevistiide** (*bolig og fritidsbolig*)[^lovdata-for-2015-12-17-1710].\n\n[^lovdata-lov-2002-06-14-20]: Brann- og eksplosjonsvernloven (LOV-2002-06-14-20) — §§ 1, 5–8 og 13\n[^lovdata-for-2015-12-17-1710]: Forskrift om brannforebygging (FOR-2015-12-17-1710) — Kapittel 1–3\n[^helsedir-helse-miljo-14]: Veileder til forskrift om helse og miljø i barnehager, skoler og skolefritidsordninger — § 14 Beredskap, førstehjelp og sikkerhetsutstyr - Helsedirektoratet\n[^lovdata-for-2017-06-19-840]: Byggteknisk forskrift (TEK17, FOR-2017-06-19-840) — Kapittel 11 utvalgte paragrafer (via api.lovdata.no)\n[^dsb-veiledning-brannforebygging]: Veiledning til forskrift om brannforebygging - DSB\n[^dibk-tek17-11-2]: Byggteknisk forskrift (TEK17) med veiledning — § 11-2. Risikoklasser - Direktoratet for byggkvalitet\n[^udir-sikkerhet-beredskap]: Veiledning t         for (let rr = r; rr <= gEnd; rr++) {

  function parseVizAsciiBoxSpec(rawCode) {

  function parseVizAsciiBoxLines(srcLines) {

            const rCh = normLines[r][c2];

          for (let cm = c1 + 2; cm <= c2 - 2; cm++) {

        if (blk) continue;
        let lt = false;
        let rt = false;
        const toks = [];
        for (let r = rs; r <= re; r++) {
          const ns = normLines[r].slice(L.c2 + 1, R.c1).replace(/\x00/g, "").trim();
          const raws = (rawLines[r] || "").padEnd(maxCols, " ").slice(L.c2 + 1, R.c1).replace(/\x00/g, "").trim();
          if (!ns) continue;

          toks.forEach(function (tk) { jl = !jl ? tk : jl.endsWith("-") ? jl.slice(0, -1) + tk : jl + " " + tk; });

    const dirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
    for (let r = 0; r < normLines.length; r++) {
      for (let c = 0; c < maxCols; c++) {
        if (owner[r][c] !== -1 || vis[r][c] || !isWire(normLines[r][c])) continue;
        const q = [[r, c]];
        vis[r][c] = 1;
        const srcs = new Set();
        const tgts = new Set();
        for (let h = 0; h < q.length; h++) {
          const cr = q[h][0];
          const cc = q[h][1];
          const ch = normLines[cr][cc];
          if (cr + 1 < normLines.length && owner[cr + 1][cc] !== -1 && (ch === "v" || ch === "V" || ch === "|" || ch === "+")) tgts.add(owner[cr + 1][cc]);

          for (let di = 0; di < 4; di++) {
            const nr = cr + dirs[di][0];
            const nc = cc + dirs[di][1];

  }

  function renderVizFlowDiagram(spec) {
    if (!spec || !Array.isArray(spec.nodes) || spec.nodes.length === 0) return "";

    const nodes = spec.nodes;
    const edges = Array.isArray(spec.edges) ? spec.edges : [];

    const inDeg = new Map();
    const orderIdx = new Map();
    nodes.forEach(function (n, idx) { adj.set(n.id, []); inDeg.set(n.id, 0); orderIdx.set(n.id, idx); });

    const q = [];
    nodes.forEach(function (n) { if ((inDeg.get(n.id) || 0) === 0) { rankById.set(n.id, 0); q.push(n.id); } });
    if (q.length === 0) { rankById.set(nodes[0].id, 0); q.push(nodes[0].id); }
    const visits = new Map();
    for (let h = 0; h < q.length; h++) {
      const u = q[h];
      const ur = rankById.get(u) || 0;
      (adj.get(u) || []).forEach(function (v) {
        const vc = (visits.get(v) || 0) + 1;
        visits.set(v, vc);
        if (vc > nodes.length * 2) return;

    for (let p = 0; p < 3; p++) {
      edges.forEach(function (e) {
        if (!e.bidirectional) return;
        if (rankById.has(e.from) && !rankById.has(e.to)) rankById.set(e.to, rankById.get(e.from));
        else if (rankById.has(e.to) && !rankById.has(e.from)) rankById.set(e.from, rankById.get(e.to));
      });
    }
    let maxR = 0;
    nodes.forEach(function (n) {
      if (!rankById.has(n.id)) rankById.set(n.id, 0);
      if (rankById.get(n.id) > maxR) maxR = rankById.get(n.id);
    });
    const rows = Array.from({ length: maxR + 1 }, function () { return []; });
    nodes.forEach(function (n) { rows[rankById.get(n.id) || 0].push(n); });

    const rowIdx = new Map();
    const colPos = new Map();
    nonEmpty.forEach(function (row, ri) {
      row.sort(function (a, b) { return (orderIdx.get(a.id) || 0) - (orderIdx.get(b.id) || 0); });

    for (let ri = 0; ri < nonEmpty.length; ri++) {
      const row = nonEmpty[ri];
      const isRoot = ri === 0 && row.length === 1 && nonEmpty.length > 1;
      out += '<div class="a2ui-flow-rank-row">';
      for (let ci = 0; ci < row.length; ci++) {
        const n = row[ci];
        out += '<div class="a2ui-flow-node-card' + (isRoot ? " is-root" : "") + '"><div class="a2ui-flow-node-title">' + escapeHtmlAttr(n.title) + "</div>";
        if (n.subtitle) {
          const subs = String(n.subtitle).split(/\s*(?:·|\|)\s*/).filter(Boolean);
          out += '<div class="a2ui-flow-node-subtitles">' + subs.map(function (s) { return '<span class="a2ui-flow-node-subtitle">' + escapeHtmlAttr(s) + "</span>"; }).join("") + "</div>";
        }
