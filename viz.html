<html lang="se">
<head>
<meta charset="utf-8">
<title>OKF Bundle Viewer</title>

<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
  color: #0f172a;
}
.controls input::placeholder { color: #64748b; opacity: 1; }
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }
main { display: flex; flex: 1; min-height: 0; }
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty { text-align: center; margin-top: 40px; }
.detail-header { margin-bottom: 12px; }
.detail-header h1 { font-size: 18px; margin: 4px 0 2px; font-weight: 600; }
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt { color: #64748b; font-weight: 500; }
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }
.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}
.badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 2px 0; }
.src-badge {
  display: inline-block;
  margin-left: 4px;
  padding: 1px 6px;
  border-radius: 4px;
  font-size: 10px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
  vertical-align: middle;
  border: 1px solid transparent;
}
.src-badge.retrieved { background: #f1f5f9; color: #475569; border-color: #e2e8f0; }
.src-badge.modified { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.src-badge.mime-pdf { background: #fff1f2; color: #be123c; border-color: #fda4af; font-weight: 700; }
.src-badge.mime-html { background: #f0f9ff; color: #0369a1; border-color: #bae6fd; font-weight: 600; }
.src-badge.mime-data { background: #eef2ff; color: #4338ca; border-color: #c7d2fe; font-weight: 600; }
.src-badge.mime-doc { background: #f0fdfa; color: #0f766e; border-color: #99f6e4; font-weight: 600; }
hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }
#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 { font-size: 16px; margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid #e2e8f0; }
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td { border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px; }
#detail-body a.internal { color: #2563eb; cursor: pointer; font-weight: 500; }
#detail-body a.external { color: #2563eb; }
#detail-body sup.fn-ref { font-size: 10px; margin-left: 2px; }
#detail-body sup.fn-ref a { color: #2563eb; text-decoration: none; font-weight: 600; }
#detail-body section.footnotes { margin-top: 16px; padding-top: 8px; border-top: 1px solid #e2e8f0; font-size: 12px; color: #475569; }
#detail-body section.footnotes ul { padding-left: 18px; margin: 4px 0; }
#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }
.a2ui-flow-diagram { margin: 12px 0; padding: 12px; border-radius: 10px; background: #f8fafc; border: 1px solid #e2e8f0; overflow-x: auto; }
.a2ui-flow-diagram-heading { font-size: 11.5px; font-weight: 700; color: #334155; text-transform: uppercase; margin-bottom: 8px; text-align: center; }
.a2ui-flow-ranks { display: flex; flex-direction: column; gap: 0; }
.a2ui-flow-ranks.dir-lr { flex-direction: row; align-items: stretch; gap: 8px; }
.a2ui-flow-rank-row { display: flex; flex-direction: row; align-items: stretch; justify-content: center; gap: 8px; flex-wrap: wrap; }
.a2ui-flow-ranks.dir-lr .a2ui-flow-rank-row { flex-direction: column; flex: 1 1 0; }
.a2ui-flow-node-card { flex: 1 1 160px; background: #fff; border: 1px solid #cbd5e1; border-top: 3px solid #2563eb; border-radius: 8px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.a2ui-flow-node-card.is-root { border-top-color: #1d4ed8; background: linear-gradient(180deg, #eff6ff 0%, #fff 60%); }
.a2ui-flow-node-card.is-root .a2ui-flow-node-title { text-align: center; }
.a2ui-flow-node-title { font-size: 12px; font-weight: 700; color: #0f172a; }
.a2ui-flow-node-subtitles { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.a2ui-flow-node-card.is-root .a2ui-flow-node-subtitles { justify-content: center; }
.a2ui-flow-node-subtitle { display: inline-block; align-self: flex-start; font-size: 10.5px; font-weight: 600; color: #1e40af; background: #dbeafe; border-radius: 5px; padding: 1px 6px; }
.a2ui-flow-node-bullets { margin: 3px 0 0 0; padding: 5px 0 0 15px; border-top: 1px solid #e2e8f0; font-size: 11px; color: #334155; }
.a2ui-flow-bridge { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 2px; font-size: 10.5px; }
.a2ui-flow-bridge svg { width: 44px; height: 16px; }
.a2ui-flow-edge-pill { display: inline-block; font-size: 10px; font-weight: 600; color: #334155; background: #fff; border: 1px solid #cbd5e1; border-radius: 999px; padding: 1px 6px; }
.a2ui-flow-connector-band { position: relative; width: 100%; height: 34px; }
.a2ui-flow-connector-band svg { width: 100%; height: 100%; display: block; }
.a2ui-flow-band-labels { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-around; pointer-events: none; }
</style>
</head>
<body>
<header>
  <div class="title">
    <strong id="bundle-name"></strong>
    <span class="muted">OKF v0.3 bundle</span>
  </div>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title / id / tag">
    <select id="filter-type">
      <option value="">All types</option>
    </select>
    <select id="layout">
      <option value="cose">cose (force)</option>
      <option value="concentric">concentric</option>
      <option value="breadthfirst">breadth-first</option>
      <option value="circle">circle</option>
      <option value="grid">grid</option>
    </select>
    <button id="reset">Reset view</button>
  </div>
</header>

<main>
  <section id="graph"></section>
  <section id="detail">
    <div id="detail-empty" class="muted">Click a node to see its details.</div>
    <article id="detail-content" hidden>
      <header class="detail-header">
        <span class="type-chip" id="detail-type"></span>
        <h1 id="detail-title"></h1>
        <div class="muted" id="detail-id"></div>
      </header>
      <div class="badges" id="detail-badges"></div>
      <dl class="frontmatter">
        <dt>Description</dt><dd id="detail-description"></dd>
        <dt>Resource</dt><dd id="detail-resource"></dd>
        <dt>Tags</dt><dd id="detail-tags"></dd>
        <dt>Generated</dt><dd id="detail-generated"></dd>
        <dt>Verified</dt><dd id="detail-verified"></dd>
        <dt>Sources</dt><dd id="detail-sources"></dd>
      </dl>
      <hr>
      <div id="detail-body"></div>
      <section id="detail-backlinks" hidden>
        <h2>Cited by</h2>
        <ul id="backlinks-list"></ul>
      </section>
    </article>
  </section>
</main>
